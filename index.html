}

/* 酸涎者：驼背细长 + 长颈 + 背上酸囊 + 垂涎 */
function drawSpitter(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob, T } = B;
  const bodyY = cy + r*0.08 - bob*0.4, footY = cy + r*0.95;
  const sac = '#b6ff7a';
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.36;
    drawLimb(ctx, cx + rx*s*r*0.3, bodyY + r*0.24, cx + rx*s*r*0.3 + fx*sw, footY, r*0.10, s > 0 ? light : dark);
  }
  // 驼背身体
  vEllipse(ctx, cx, bodyY, r*0.72, r*0.66, light, col, dark);
  // 酸囊（半透明，晃动）
  for (let i = 0; i < 3; i++){
    const jig = Math.sin(T*4 + e.phase + i*1.4) * r*0.03;
    const sx = cx - fx*r*0.18 + rx*(i - 1)*r*0.34, sy = bodyY - r*0.42 + Math.abs(i-1)*r*0.1 + jig;
    ctx.globalAlpha = 0.75;
    vEllipse(ctx, sx, sy, r*0.2, r*0.17, '#e6ffd0', sac, shade(sac, -0.4));
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(sx - r*0.06, sy - r*0.06, r*0.05, 0, Math.PI*2); ctx.fill();
  }
  // 长颈 + 小头
  const hx = cx + fx*r*0.95, hy = bodyY - r*0.62;
  ctx.strokeStyle = col; ctx.lineWidth = r*0.22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx + fx*r*0.4, bodyY - r*0.2); ctx.lineTo(hx, hy); ctx.stroke();
  vEllipse(ctx, hx, hy, r*0.3, r*0.26, light, col, dark);
  // 下垂嘴 + 一滴酸涎
  ctx.strokeStyle = shade(col, -0.3); ctx.lineWidth = r*0.06;
  ctx.beginPath(); ctx.moveTo(hx + fx*r*0.16, hy + fy*r*0.14 + r*0.1); ctx.lineTo(hx + fx*r*0.3, hy + fy*r*0.24 + r*0.18); ctx.stroke();
  const drip = (T*2 + e.phase) % 1;
  ctx.fillStyle = sac;
  ctx.beginPath(); ctx.arc(hx + fx*r*0.32, hy + fy*r*0.24 + r*0.2 + drip*r*0.5, r*0.06*(1 - drip*0.5), 0, Math.PI*2); ctx.fill();
  // 大圆眼
  cEye(ctx, hx + fx*r*0.1 + rx*r*0.14, hy - r*0.06, r*0.11, '#eaffb0');
  cEye(ctx, hx + fx*r*0.1 - rx*r*0.14, hy - r*0.06, r*0.11, '#eaffb0');
}

/* 影虎：流线身体 + 条纹 + 长尾 + 尖耳 + 长腿 */
function drawTiger(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob, T } = B;
  const bodyY = cy - r*0.05 - bob*0.7, footY = cy + r*0.95;
  const stripe = shade(col, -0.55);
  // 长腿（对角步态感）
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.44;
    drawLimb(ctx, cx + rx*s*r*0.44, bodyY + r*0.3, cx + rx*s*r*0.44 + fx*sw, footY, r*0.11, s > 0 ? light : dark);
  }
  // 流线身体
  vEllipse(ctx, cx, bodyY, r*1.12, r*0.6, light, col, dark);
  // 条纹
  ctx.strokeStyle = stripe; ctx.lineWidth = r*0.09; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++){
    const sx = cx + rx*i*r*0.3 + fx*r*0.1;
    ctx.beginPath();
    ctx.moveTo(sx, bodyY - r*0.5);
    ctx.quadraticCurveTo(sx + rx*r*0.12, bodyY - r*0.2, sx + rx*r*0.04, bodyY + r*0.1);
    ctx.stroke();
  }
  // 长尾（摆动）
  const tw = Math.sin(T*3 + e.phase) * r*0.4;
  ctx.strokeStyle = col; ctx.lineWidth = r*0.13; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - fx*r*1.0, bodyY + r*0.1);
  ctx.quadraticCurveTo(cx - fx*r*1.5, bodyY + r*0.1 + tw*0.5, cx - fx*r*1.7, bodyY - r*0.2 + tw);
  ctx.stroke();
  ctx.fillStyle = stripe;
  ctx.beginPath(); ctx.arc(cx - fx*r*1.7, bodyY - r*0.2 + tw, r*0.11, 0, Math.PI*2); ctx.fill();
  // 头 + 尖耳
  const hx = cx + fx*r*1.05, hy = bodyY - r*0.28;
  vEllipse(ctx, hx, hy, r*0.36, r*0.32, light, col, dark);
  ctx.fillStyle = col;
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(hx + rx*s*r*0.2, hy - r*0.24);
    ctx.lineTo(hx + rx*s*r*0.34 + fx*r*0.05, hy - r*0.52);
    ctx.lineTo(hx + rx*s*r*0.36, hy - r*0.2);
    ctx.closePath(); ctx.fill();
  }
  // 吻部 + 须
  vEllipse(ctx, hx + fx*r*0.28, hy + fy*r*0.08, r*0.16, r*0.12, light, col, dark);
  ctx.fillStyle = 'rgba(20,14,16,0.85)';
  ctx.beginPath(); ctx.arc(hx + fx*r*0.38, hy + fy*r*0.08, r*0.05, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath(); ctx.moveTo(hx + fx*r*0.34, hy + fy*s*r*0.08); ctx.lineTo(hx + fx*r*0.62, hy + fy*s*r*0.2); ctx.stroke();
  }
  cEye(ctx, hx + fx*r*0.1 + rx*r*0.14, hy - r*0.08, r*0.08, '#ffd166');
  cEye(ctx, hx + fx*r*0.1 - rx*r*0.14, hy - r*0.08, r*0.08, '#ffd166');
}

/* 疫猩王：宽胸 + 长臂指节行走 + 小头 + 眉脊 + 缝合 */
function drawApe(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob, T } = B;
  const bodyY = cy + r*0.02 - bob*0.5, footY = cy + r*0.95;
  // 长臂（前后摆动，指节着地）
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk2 : walk) * r*0.5;
    const shx = cx + rx*s*r*0.42, shy = bodyY - r*0.28;
    drawLimb(ctx, shx, shy, shx + fx*(r*0.5 + sw), shy + r*0.62 + Math.abs(sw)*0.2, r*0.16, s > 0 ? light : dark);
  }
  // 短粗腿
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.26;
    drawLimb(ctx, cx + rx*s*r*0.3, bodyY + r*0.4, cx + rx*s*r*0.3 + fx*sw, footY, r*0.2, s > 0 ? light : dark);
  }
  // 宽胸 + 收腰
  vEllipse(ctx, cx - fx*r*0.06, bodyY, r*0.98, r*0.88, light, col, dark);
  vEllipse(ctx, cx - fx*r*0.34, bodyY + r*0.1, r*0.6, r*0.6, light, col, dark);
  // 肩部毛簇
  ctx.fillStyle = light;
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath(); ctx.arc(cx + rx*s*r*0.62, bodyY - r*0.42, r*0.2, 0, Math.PI*2); ctx.fill();
  }
  // 胸口缝合
  ctx.strokeStyle = 'rgba(25,18,22,0.55)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++){
    const sx = cx + rx*(i - 1)*r*0.22, sy = bodyY + r*0.28;
    ctx.beginPath(); ctx.moveTo(sx - r*0.09, sy - r*0.07); ctx.lineTo(sx + r*0.09, sy + r*0.07); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - r*0.09, sy + r*0.07); ctx.lineTo(sx + r*0.09, sy - r*0.07); ctx.stroke();
  }
  // 小头 + 眉脊
  const hx = cx + fx*r*0.82, hy = bodyY - r*0.5;
  vEllipse(ctx, hx, hy, r*0.34, r*0.3, light, col, dark);
  ctx.fillStyle = shade(col, -0.4);
  ctx.beginPath(); ctx.ellipse(hx + fx*r*0.08, hy - r*0.14, r*0.26, r*0.09, 0, 0, Math.PI*2); ctx.fill();
  // 吻部
  vEllipse(ctx, hx + fx*r*0.26, hy + fy*r*0.1, r*0.2, r*0.15, light, shade(col, -0.05), dark);
  ctx.fillStyle = 'rgba(22,12,14,0.8)';
  ctx.beginPath(); ctx.arc(hx + fx*r*0.34, hy + fy*r*0.1, r*0.045, 0, Math.PI*2); ctx.fill();
  cEye(ctx, hx + fx*r*0.12 + rx*r*0.13, hy - r*0.06, r*0.07, '#ff5c7a');
  cEye(ctx, hx + fx*r*0.12 - rx*r*0.13, hy - r*0.06, r*0.07, '#ff5c7a');
}

/* 焰鳞龙：巨翼 + 背脊刺 + 长尾 + 角首 + 腹鳞 */
function drawDragon(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob, T } = B;
  const bodyY = cy - r*0.12 - bob*0.3, footY = cy + r*0.95;
  const wing = shade(col, -0.3), spike = shade(col, 0.35);
  // 长尾（摆动 + 三角尾梢）
  const tw = Math.sin(T*2.6 + e.phase) * r*0.5;
  ctx.strokeStyle = col; ctx.lineWidth = r*0.3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - fx*r*0.9, bodyY + r*0.1);
  ctx.quadraticCurveTo(cx - fx*r*1.6, bodyY + r*0.3 + tw*0.4, cx - fx*r*2.0, bodyY + r*0.1 + tw);
  ctx.stroke();
  ctx.fillStyle = spike;
  ctx.beginPath();
  ctx.moveTo(cx - fx*r*1.9, bodyY + r*0.05 + tw);
  ctx.lineTo(cx - fx*r*2.35, bodyY - r*0.15 + tw);
  ctx.lineTo(cx - fx*r*2.0, bodyY + r*0.35 + tw);
  ctx.closePath(); ctx.fill();
  // 巨翼（拍打）
  const flap = Math.sin(T*5 + e.phase) * r*0.5;
  for (let s = -1; s <= 1; s += 2){
    ctx.save();
    ctx.translate(cx + rx*s*r*0.4, bodyY - r*0.45);
    ctx.rotate(rx*s * (0.5 + flap*0.25));
    const wg = ctx.createLinearGradient(0, 0, s*r*1.5, -r*0.4);
    wg.addColorStop(0, shade(col, -0.15)); wg.addColorStop(1, shade(col, -0.6));
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(s*r*1.3, -r*0.95, s*r*1.75, -r*0.15);
    ctx.quadraticCurveTo(s*r*1.2, -r*0.1, s*r*0.9, r*0.3);
    ctx.quadraticCurveTo(s*r*0.6, r*0.05, 0, r*0.22);
    ctx.closePath(); ctx.fill();
    // 翼骨
    ctx.strokeStyle = shade(col, -0.5); ctx.lineWidth = r*0.06;
    for (let i = 1; i <= 3; i++){
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s*r*i*0.5, -r*0.7, s*r*1.6, -r*0.2 + i*r*0.06);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 壮硕身体 + 腹鳞
  vEllipse(ctx, cx, bodyY, r*0.95, r*0.9, light, col, dark);
  ctx.fillStyle = 'rgba(255,235,180,0.18)';
  ctx.beginPath(); ctx.ellipse(cx + fx*r*0.1, bodyY + r*0.42, r*0.5, r*0.36, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,235,180,0.28)'; ctx.lineWidth = 1.2;
  for (let i = -2; i <= 2; i++){
    ctx.beginPath(); ctx.arc(cx + fx*r*0.1 + rx*i*r*0.18, bodyY + r*0.42, r*0.12, Math.PI, 0); ctx.stroke();
  }
  // 背脊刺
  ctx.fillStyle = spike;
  for (let i = -1; i <= 1; i++){
    const sx = cx - fx*i*r*0.36, sy = bodyY - r*0.78;
    ctx.beginPath();
    ctx.moveTo(sx - r*0.14, sy + r*0.2);
    ctx.lineTo(sx, sy - r*0.3 - Math.abs(i)*r*0.08);
    ctx.lineTo(sx + r*0.14, sy + r*0.2);
    ctx.closePath(); ctx.fill();
  }
  // 腿
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.3;
    drawLimb(ctx, cx + rx*s*r*0.4, bodyY + r*0.4, cx + rx*s*r*0.4 + fx*sw, footY, r*0.2, s > 0 ? light : dark);
  }
  // 角首
  const hx = cx + fx*r*0.92, hy = bodyY - r*0.5;
  vEllipse(ctx, hx, hy, r*0.44, r*0.38, light, col, dark);
  vEllipse(ctx, hx + fx*r*0.34, hy + fy*r*0.1, r*0.24, r*0.18, light, shade(col, 0.05), dark);
  // 角
  ctx.strokeStyle = spike; ctx.lineWidth = r*0.1; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(hx + rx*s*r*0.24, hy - r*0.24);
    ctx.quadraticCurveTo(hx + rx*s*r*0.6, hy - r*0.6, hx + rx*s*r*0.3 - fx*r*0.2, hy - r*0.85);
    ctx.stroke();
  }
  // 齿
  ctx.fillStyle = '#f0ead8';
  for (let i = -1; i <= 1; i++){
    ctx.beginPath();
    ctx.moveTo(hx + fx*r*0.3 + rx*i*r*0.1, hy + fy*r*0.16);
    ctx.lineTo(hx + fx*r*0.42 + rx*i*r*0.1, hy + fy*r*0.16);
    ctx.lineTo(hx + fx*r*0.36 + rx*i*r*0.1, hy + fy*r*0.16 + r*0.12);
    ctx.closePath(); ctx.fill();
  }
  cEye(ctx, hx + fx*r*0.14 + rx*r*0.17, hy - r*0.06, r*0.09, '#ff7af0');
  cEye(ctx, hx + fx*r*0.14 - rx*r*0.17, hy - r*0.06, r*0.09, '#ff7af0');
  // 喷火预备（攻击时嘴里冒火）
  if (e.attack > 0){
    const fa = Math.min(1, e.attack * 4);
    ctx.globalAlpha = fa;
    const mg = ctx.createRadialGradient(hx + fx*r*0.5, hy + fy*r*0.14, 0, hx + fx*r*0.5, hy + fy*r*0.14, r*0.4);
    mg.addColorStop(0, '#fff6c8'); mg.addColorStop(0.4, '#ffb03a'); mg.addColorStop(1, 'rgba(255,80,30,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(hx + fx*r*0.5, hy + fy*r*0.14, r*0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* 兜底通用兽形 */
function drawBeast(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob } = B;
  const bodyY = cy - r*0.15 - bob, footY = cy + r*0.92;
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.4;
    drawLimb(ctx, cx + rx*s*r*0.3, bodyY + r*0.3, cx + rx*s*r*0.3 + fx*sw, footY, r*0.16, s > 0 ? light : dark);
  }
  vEllipse(ctx, cx, bodyY, r*0.9, r*0.95, light, col, dark);
  const hx = cx + fx*r*0.85, hy = bodyY - r*0.55;
  vEllipse(ctx, hx, hy, r*0.42, r*0.4, light, col, dark);
  cEye(ctx, hx + fx*r*0.16, hy, r*0.09, '#fff0a0');
}

function drawCreature(ctx, e, cx, cy, r, T, p){
  const col = e.color;
  const B = {
    ctx, cx, cy, r, col,
    light: shade(col, 0.45), dark: shade(col, -0.55), edge: shade(col, 0.7),
    face: Math.atan2(p.y - cy, p.x - e.x), T
  };
  B.fx = Math.cos(B.face); B.fy = Math.sin(B.face);
  B.rx = -Math.sin(B.face); B.ry = Math.cos(B.face);
  B.ph = T * 9 + e.phase;
  B.walk = Math.sin(B.ph); B.walk2 = Math.sin(B.ph + Math.PI);
  B.bob = Math.abs(Math.sin(B.ph)) * r * 0.10;
  if (e.beh === 'charger') drawBoar(B, e);
  else if (e.beh === 'splitter') drawSheep(B, e);
  else if (e.beh === 'brute') drawBull(B, e);
  else if (e.beh === 'spitter') drawSpitter(B, e);
  else if (e.beh === 'stalker') drawTiger(B, e);
  else if (e.beh === 'slam') drawApe(B, e);
  else if (e.beh === 'boss') drawDragon(B, e);
  else drawBeast(B, e);
  // 攻击挥击弧（朝玩家）
  if (e.attack > 0){
    ctx.globalAlpha = Math.min(1, e.attack * 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r*1.5, B.face - 0.8, B.face + 0.8); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* ================= 地图光源：火把 / 篝火 / 灯笼（暖色调） ================= */
function flame(ctx, x, y, r, t, scale){
  const s = scale || 1;
  const wig = Math.sin(t * 13) * r * 0.16 + Math.sin(t * 29) * r * 0.07;
  // 外焰光晕
  const g1 = ctx.createRadialGradient(x, y - r*0.2, 0, x, y - r*0.2, r*2.1*s);
  g1.addColorStop(0, 'rgba(255,206,110,0.55)');
  g1.addColorStop(0.4, 'rgba(255,148,48,0.28)');
  g1.addColorStop(1, 'rgba(255,110,30,0)');
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(x, y - r*0.2, r*2.1*s, 0, Math.PI*2); ctx.fill();
  // 外焰
  const g2 = ctx.createRadialGradient(x, y, 0, x, y - r*0.5, r*1.7);
  g2.addColorStop(0, 'rgba(255,226,140,0.95)');
  g2.addColorStop(0.5, 'rgba(255,152,52,0.8)');
  g2.addColorStop(1, 'rgba(255,92,24,0)');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.moveTo(x - r, y + r*0.35);
  ctx.quadraticCurveTo(x - r*1.15 + wig, y - r*1.15, x + wig*0.6, y - r*2.0);
  ctx.quadraticCurveTo(x + r*1.15 + wig, y - r*1.15, x + r, y + r*0.35);
  ctx.closePath(); ctx.fill();
  // 内焰
  const g3 = ctx.createRadialGradient(x, y + r*0.15, 0, x, y + r*0.15, r*0.9);
  g3.addColorStop(0, 'rgba(255,255,230,0.95)');
  g3.addColorStop(1, 'rgba(255,224,130,0)');
  ctx.fillStyle = g3;
  ctx.beginPath(); ctx.ellipse(x + wig*0.3, y - r*0.3, r*0.44, r*0.68, 0, 0, Math.PI*2); ctx.fill();
}
function drawLights(ctx, game){
  const list = game.lights, T = game.time, cam = game.camera;
  const pad = VIEW.cullPad + 80;
  for (let i=0;i<list.length;i++){
    const L = list[i];
    if (L.x < cam.x - pad || L.x > cam.x + game.w + pad || L.y < cam.y - pad || L.y > cam.y + game.h + pad) continue;
    const flick = 0.86 + Math.sin(T*11 + L.phase) * 0.07 + Math.sin(T*23 + L.phase*2) * 0.05;
    // 地面暖色光池
    const g = ctx.createRadialGradient(L.x, L.y, 4, L.x, L.y, L.r * flick);
    g.addColorStop(0, 'rgba(255,176,86,0.26)');
    g.addColorStop(0.45, 'rgba(255,148,56,0.11)');
    g.addColorStop(1, 'rgba(255,140,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(L.x, L.y, L.r * flick, 0, Math.PI*2); ctx.fill();
    if (L.type === 'campfire'){
      // 石圈
      for (let k=0;k<7;k++){
        const a = k / 7 * Math.PI * 2;
        ctx.fillStyle = k % 2 ? '#5a564e' : '#46433c';
        ctx.beginPath(); ctx.ellipse(L.x + Math.cos(a)*15, L.y + 4 + Math.sin(a)*6, 5, 3.4, a, 0, Math.PI*2); ctx.fill();
      }
      // 交叉木柴
      ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(L.x - 12, L.y + 2); ctx.lineTo(L.x + 12, L.y - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L.x - 12, L.y - 4); ctx.lineTo(L.x + 12, L.y + 2); ctx.stroke();
      flame(ctx, L.x, L.y - 8, 11, T + L.phase, 1.25);
    } else if (L.type === 'lantern'){
      // 灯杆 + 横臂 + 纸灯笼（轻摆）
      ctx.strokeStyle = '#3a2c1e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(L.x, L.y + 2); ctx.lineTo(L.x, L.y - 34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L.x - 9, L.y - 34); ctx.lineTo(L.x + 9, L.y - 34); ctx.stroke();
      const sway = Math.sin(T*1.6 + L.phase) * 0.1;
      const lx = L.x + Math.sin(sway) * 6, ly = L.y - 26;
      ctx.strokeStyle = '#241a10'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(L.x + 9, L.y - 34); ctx.lineTo(lx, ly - 6); ctx.stroke();
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 26);
      lg.addColorStop(0, 'rgba(255,200,110,0.5)'); lg.addColorStop(1, 'rgba(255,160,60,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, 26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#c8843a';
      ctx.fillRect(lx - 5, ly - 6, 10, 12);
      ctx.fillStyle = 'rgba(255,220,140,0.95)';
      ctx.fillRect(lx - 3.4, ly - 4.4, 6.8, 9);
      ctx.fillStyle = '#3a2c1e'; ctx.fillRect(lx - 6, ly - 8, 12, 2.4);
      flame(ctx, lx, ly - 2, 4.5, T + L.phase, 0.8);
    } else {
      // 火把：木杆 + 绑绳 + 火焰
      ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(L.x, L.y + 2); ctx.lineTo(L.x, L.y - 28); ctx.stroke();
      ctx.strokeStyle = '#1e1610'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(L.x - 4, L.y - 24); ctx.lineTo(L.x + 4, L.y - 19); ctx.stroke();
      // 顶端缠布
      ctx.fillStyle = '#4a3a26';
      ctx.fillRect(L.x - 3.4, L.y - 34, 6.8, 8);
      flame(ctx, L.x, L.y - 34, 8, T + L.phase, 1);
    }
    // 上升火星
    for (let k=0;k<3;k++){
      const sp = (T*0.55 + k*0.34 + L.phase) % 1;
      const sx = L.x + Math.sin(sp*9 + L.phase + k*2) * 6;
      const sy = L.y - 30 - sp * 36;
      ctx.globalAlpha = (1 - sp) * 0.85;
      ctx.fillStyle = k % 2 ? '#ffcf7a' : '#ff9a3a';
      ctx.beginPath(); ctx.arc(sx, sy, 1.7 * (1 - sp*0.55), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ================= 尸骸残留（击杀反馈） ================= */
function drawCorpses(ctx, game){
  const list = game.corpses;
  for (let i=0;i<list.length;i++){
    const c = list[i];
    const a = c.life / c.maxLife;
    if (a <= 0) continue;
    ctx.globalAlpha = a * 0.55;
    // 本色污渍
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.ellipse(c.x, c.y + c.r*0.55, c.r*0.85, c.r*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = a * 0.5;
    // 暗影轮廓
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(c.x - c.r*0.1, c.y + c.r*0.4, c.r*0.55, c.r*0.22, 0.2, 0, Math.PI*2); ctx.fill();
    if (c.boss){
      ctx.globalAlpha = a * 0.4;
      ctx.strokeStyle = c.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r*0.9, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function render(ctx, game, w, h){
  const cam = game.camera, p = game.player;
  const sh = game.shake;
  const shx = sh > 0 ? (Math.random()*2 - 1) * sh : 0;
  const shy = sh > 0 ? (Math.random()*2 - 1) * sh : 0;

  // 贴图异步加载：完成后自动从程序化纹理切换到 AI 贴图
  if (!groundPattern || (bgTileImg.complete && !groundFromImg)) buildGroundPattern(ctx);
  ctx.fillStyle = VIEW.bg;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(-cam.x + shx, -cam.y + shy);
  if (groundPattern){
    ctx.fillStyle = groundPattern;
    ctx.fillRect(cam.x - shx - 8, cam.y - shy - 8, w + 16, h + 16);
  }
  drawArena(ctx);
  drawPonds(ctx, game);
  drawDecor(ctx, game);
  drawBlockers(ctx, game);
  drawCorpses(ctx, game);
  drawWalls(ctx, game);
  drawLights(ctx, game);

  const pad = VIEW.cullPad;
  const l = cam.x-pad, t = cam.y-pad, r = cam.x+w+pad, b = cam.y+h+pad;
  const vis = (x,y) => x >= l && x <= r && y >= t && y <= b;

  // 经验宝石
  const orbs = game.orbs;
  for (let i=0;i<orbs.length;i++){
    const o = orbs[i]; if (!vis(o.x, o.y)) continue;
    const gem = o.value >= 12 ? '#ffd166' : o.value >= 5 ? '#c86bff' : o.value >= 2 ? '#5ad2ff' : '#7ef0ff';
    drawGem(ctx, o.x, o.y, o.r + 1.5, gem, game.time*2.4 + o.x*0.05);
  }

  // 光环
  if (p.m.auraDmg > 0){
    ctx.strokeStyle = 'rgba(255,150,90,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER.radius + p.m.auraRadius, 0, Math.PI*2); ctx.stroke();
  }

  // 近战挥砍（扇形刀光 + 白边 + 刀尖上的真实刀身）
  const sl = game.slashes;
  for (let i=0;i<sl.length;i++){
    const s = sl[i];
    const a = Math.max(0, s.life / s.maxLife);
    const sc = (WEAPONS[s.wid] && WEAPONS[s.wid].hit) || '#ffe27a';
    const isScythe = s.wid === 'scythe';
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = sc;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.reach, s.ang - s.arc/2, s.ang + s.arc/2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = a * 0.9;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.reach, s.ang - s.arc/2, s.ang + s.arc/2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // 刀身：跟随挥砍进度从弧尾划到弧头
    const prog = 1 - a;
    const head = s.ang - s.arc/2 + s.arc * Math.min(1, prog * 1.35);
    const tail = Math.max(s.ang - s.arc/2, head - s.arc * 0.55);
    const bx = s.x + Math.cos(head) * s.reach, by = s.y + Math.sin(head) * s.reach;
    const tx = s.x + Math.cos(tail) * s.reach * 0.55, ty = s.y + Math.sin(tail) * s.reach * 0.55;
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(head);
    const bl2 = isScythe ? s.reach * 0.55 : s.reach * 0.34;
    // 短刃：直刀身；镰刀：弯刃 + 长柄
    if (isScythe){
      ctx.strokeStyle = '#4a3b2a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-bl2*0.7, bl2*0.25); ctx.stroke();
      const cg = ctx.createLinearGradient(0, 0, -bl2, 0);
      cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.5, sc); cg.addColorStop(1, shade(sc, -0.4));
      ctx.strokeStyle = cg; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-bl2*0.5, -bl2*0.55, -bl2, -bl2*0.1);
      ctx.stroke();
    } else {
      const bg2 = ctx.createLinearGradient(0, 0, -bl2, 0);
      bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(0.45, sc); bg2.addColorStop(1, shade(sc, -0.45));
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.moveTo(bl2*0.1, 0);
      ctx.lineTo(-bl2*0.75, -bl2*0.16);
      ctx.lineTo(-bl2, 0);
      ctx.lineTo(-bl2*0.75, bl2*0.16);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a2230';
      ctx.fillRect(-bl2*0.28, -bl2*0.07, bl2*0.34, bl2*0.14);
    }
    ctx.restore();
    // 刀光拖尾
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = sc; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.reach, tail, head); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 敌人：接触阴影 + 暗底辉光（从纹理背景里浮出来）+ 独立造型 3D 怪物 + 状态环
  const es = game.enemies, T = game.time;
  for (let i=0;i<es.length;i++){
    const e = es[i]; if (!vis(e.x, e.y)) continue;
    const r = e.radius;
    // 接触阴影
    ctx.fillStyle = 'rgba(0,0,0,0.40)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + r*0.9, r*0.95, r*0.32, 0, 0, Math.PI*2); ctx.fill();
    // 底部暗底 + 本体色辉光：和纹理地面拉开层次
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + r*0.1, r*1.05, r*0.9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y - r*0.1, r*1.7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // 体积感 3D 怪物（按种类独立造型 + 走路动画 + 朝向玩家）
    drawCreature(ctx, e, e.x, e.y, r, T, p);
    if (e.charging > 0){
      ctx.strokeStyle = 'rgba(255,143,176,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*1.6, 0, Math.PI*2); ctx.stroke();
    }
    if (e.slow > 0){
      ctx.strokeStyle = 'rgba(180,235,255,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*1.45, 0, Math.PI*2); ctx.stroke();
    }
    if (e.boss){
      const pulse = 1 + Math.sin(game.time*6)*0.06;
      ctx.strokeStyle = 'rgba(200,107,255,0.75)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*1.3*pulse, 0, Math.PI*2); ctx.stroke();
    }
    if (e.hp < e.maxHp){
      const bw = r*2.2, ratio = Math.max(0, e.hp/e.maxHp);
      const by = e.y - r*1.55;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x-bw/2, by, bw, 4);
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(e.x-bw/2, by, bw*ratio, 4);
    }
  }

  // 玩家子弹（按武器风格绘制不同模型，暴击高亮）
  const bs = game.bullets;
  for (let i=0;i<bs.length;i++){
    const bl = bs[i]; if (!vis(bl.x, bl.y)) continue;
    const bc = bl.color || '#ffffff';
    const ang = Math.atan2(bl.vy, bl.vx);
    const crit = bl.crit > 1;
    if (bl.style === 'bomb'){
      // 榴弹：带引信光的圆弹
      ctx.globalAlpha = 0.5; ctx.fillStyle = bc;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r + 3, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(bl.x - bl.r*0.3, bl.y - bl.r*0.3, 1, bl.x, bl.y, bl.r);
      g.addColorStop(0, '#3a2a18'); g.addColorStop(1, '#0c0805');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r*0.35, 0, Math.PI*2); ctx.fill();
    } else if (bl.style === 'star'){
      // 手里剑：旋转四角星
      ctx.save(); ctx.translate(bl.x, bl.y); ctx.rotate(bl.spin + game.time*22);
      ctx.fillStyle = crit ? '#ffe27a' : bc;
      ctx.beginPath();
      for (let k=0;k<4;k++){
        const a = k*Math.PI/2;
        ctx.lineTo(Math.cos(a)*bl.r*1.5, Math.sin(a)*bl.r*1.5);
        ctx.lineTo(Math.cos(a+Math.PI/4)*bl.r*0.5, Math.sin(a+Math.PI/4)*bl.r*0.5);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1c1c22'; ctx.beginPath(); ctx.arc(0,0,bl.r*0.32,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if (bl.style === 'boomr'){
      // 回旋镖：真正的 V 形双翼（ tapered 木翼 + 握把 + 翼尖高光 + 旋转残影）
      ctx.save(); ctx.translate(bl.x, bl.y); ctx.rotate(bl.spin + game.time*12);
      const R = bl.r * 1.25;
      // 旋转残影（两圈淡翼）
      ctx.globalAlpha = 0.22; ctx.strokeStyle = bc; ctx.lineWidth = bl.r*0.3; ctx.lineCap = 'round';
      for (let k = 1; k <= 2; k++){
        const ra = -k * 0.55;
        ctx.beginPath(); ctx.arc(0, 0, R, ra - 0.5, ra + 0.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, R, Math.PI + ra - 0.5, Math.PI + ra + 0.5); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // 双翼（渐变木体）
      const wg = ctx.createLinearGradient(-R, -R, R, R);
      wg.addColorStop(0, crit ? '#fff0b8' : shade(bc, 0.35));
      wg.addColorStop(0.5, bc);
      wg.addColorStop(1, shade(bc, -0.35));
      ctx.fillStyle = wg;
      for (let s = -1; s <= 1; s += 2){
        ctx.beginPath();
        ctx.moveTo(0, s * bl.r * 0.06);
        ctx.quadraticCurveTo(R*0.62, s*R*0.72, R*1.04, s*R*0.22);   // 外缘
        ctx.quadraticCurveTo(R*0.6, s*R*0.3, 0, s*bl.r*0.2);        // 内缘
        ctx.closePath(); ctx.fill();
      }
      // 翼尖高光
      ctx.fillStyle = crit ? '#ffffff' : shade(bc, 0.6);
      for (let s = -1; s <= 1; s += 2){
        ctx.beginPath(); ctx.ellipse(s*R*0.98, s*R*0.2, bl.r*0.14, bl.r*0.09, s*0.5, 0, Math.PI*2); ctx.fill();
      }
      // 中央握把
      ctx.fillStyle = shade(bc, -0.55);
      ctx.beginPath(); ctx.arc(0, 0, bl.r*0.26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(-bl.r*0.07, -bl.r*0.07, bl.r*0.09, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      // 标准弹道：拖尾 + 弹头
      if (crit){
        ctx.globalAlpha = 0.9; ctx.strokeStyle = 'rgba(255,226,122,0.6)'; ctx.fillStyle = '#ffe27a';
      } else {
        ctx.globalAlpha = 0.55; ctx.strokeStyle = bc; ctx.fillStyle = bc;
      }
      ctx.lineWidth = bl.r; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bl.x - bl.vx*0.035, bl.y - bl.vy*0.035);
      ctx.lineTo(bl.x, bl.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); ctx.fill();
    }
    bl.spin += 0.3;
  }

  // 敌方子弹（区分弹种模型，不再是一个球）
  const eb = game.ebullets;
  for (let i=0;i<eb.length;i++){
    const b = eb[i]; if (!vis(b.x, b.y)) continue;
    if (b.kind === 'acid'){
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#a6ff5c';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = '#d6ff9e';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3f6b1f';
      ctx.beginPath(); ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.4, 0, Math.PI*2); ctx.fill();
    } else if (b.kind === 'orb'){
      const t = game.time*6;
      ctx.strokeStyle = 'rgba(200,107,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, t, t + Math.PI*1.3); ctx.stroke();
      ctx.fillStyle = '#c86bff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI*2); ctx.stroke();
    }
  }

  // 粒子
  const ps = game.particles;
  for (let i=0;i<ps.length;i++){
    const pt = ps[i];
    ctx.globalAlpha = Math.max(0, pt.life/pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 无人机：四旋翼模型（机臂 + 旋转旋翼 + 机身 + 镜头）
  for (let i=0;i<game.drones.length;i++){
    const d = game.drones[i];
    const dx = p.x + Math.cos(d.angle)*52, dy = p.y + Math.sin(d.angle)*52;
    ctx.strokeStyle = 'rgba(157,251,196,0.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(dx, dy); ctx.stroke();
    ctx.save();
    ctx.translate(dx, dy);
    const spin = game.time*40;
    for (let k=0;k<4;k++){
      const a = k*Math.PI/2 + Math.PI/4;
      const ax = Math.cos(a)*9, ay = Math.sin(a)*9;
      ctx.strokeStyle = 'rgba(120,140,170,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ax, ay); ctx.stroke();
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(spin + k);
      ctx.fillStyle = 'rgba(160,255,200,0.4)';
      ctx.beginPath(); ctx.ellipse(0,0,6,2,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#26304a'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9dfbc4'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(0,2.5,1.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 回旋斧：真实斧头贴图 + 旋转 + 发光拖尾弧
  if (p.hasWeapon('orbit')){
    const def = WEAPONS.orbit;
    const w = p.hasWeapon('orbit');
    const n = 1 + (w.lv >= 3 ? 1 : 0) + (w.lv >= 5 ? 1 : 0);
    const axeImg = SPRITE_IMGS.axe;
    // 轨道发光弧
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = def.hit; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, def.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    for (let i=0;i<n;i++){
      const a = p.orbitAngle + (i * Math.PI*2 / n);
      const ox = p.x + Math.cos(a) * def.radius, oy = p.y + Math.sin(a) * def.radius;
      ctx.save();
      ctx.translate(ox, oy); ctx.rotate(a + Math.PI/4);
      if (axeImg && axeImg.complete && axeImg.naturalWidth){
        const s = def.br * 3.6;
        ctx.drawImage(axeImg, -s/2, -s/2, s, s);
      } else {
        ctx.fillStyle = def.hit;
        ctx.fillRect(-def.br/2, -def.br/2, def.br, def.br);
      }
      ctx.restore();
    }
  }

  drawPlayer(ctx, game);
  drawEffects(ctx, game);
  ctx.restore();

  drawVignette(ctx, game, w, h);
  drawStick(ctx, game.input);
}

function drawPlayer(ctx, game){
  const p = game.player;
  ctx.globalAlpha = (p.inv > 0 && Math.floor(p.inv*18) % 2 === 0) ? 0.45 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + PLAYER.radius*0.95, PLAYER.radius*0.95, PLAYER.radius*0.38, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(126,240,255,0.09)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.pickupRange, 0, Math.PI*2); ctx.stroke();

  const img = SPRITE_IMGS.player;
  const s = PLAYER.radius * 3.5;
  const tilt = (game.input.x !== 0 || game.input.y !== 0) ? game.input.x * 0.14 : 0;
  ctx.save();
  ctx.translate(p.x, p.y - 4);
  ctx.rotate(tilt);
  if (img && img.complete && img.naturalWidth){
    ctx.drawImage(img, -s/2, -s/2, s, s);
  } else {
    ctx.fillStyle = '#4ea8ff';
    ctx.beginPath(); ctx.arc(0, 0, PLAYER.radius, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,209,102,0.75)'; ctx.lineWidth = 1.8;   // 主角金色轮廓，和敌人区分开
  ctx.beginPath(); ctx.arc(p.x, p.y - 4, PLAYER.radius * 1.3, 0, Math.PI*2); ctx.stroke();
  if (p.shieldMax > 0 && p.shield > 0){
    ctx.strokeStyle = 'rgba(126,240,255,0.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y - 4, PLAYER.radius * 1.62, -Math.PI/2, -Math.PI/2 + Math.PI*2*(p.shield/p.shieldMax)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawArena(ctx){
  const H = ARENA.half, big = H + 3000;
  ctx.fillStyle = ARENA.outside;
  ctx.fillRect(-big, -big, big-H, big*2);
  ctx.fillRect(H, -big, big-H, big*2);
  ctx.fillRect(-H, -big, H*2, big-H);
  ctx.fillRect(-H, H, H*2, big-H);
  ctx.strokeStyle = ARENA.wallColor; ctx.lineWidth = 3;
  ctx.strokeRect(-H, -H, H*2, H*2);
}

function drawPonds(ctx, game){
  const list = game.ponds;
  for (let i=0;i<list.length;i++){
    const p = list[i];
    ctx.fillStyle = 'rgba(24,58,64,0.55)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r*0.72, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(126,240,255,0.16)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r*0.86, p.r*0.6, 0, 0, Math.PI*2); ctx.stroke();
  }
}

function drawDecor(ctx, game){
  const list = game.decor;
  const T = game.time;
  for (let i=0;i<list.length;i++){
    const d = list[i];
    // 统一接触阴影（让装饰像长在地上，而非漂浮）
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(d.x, d.y + d.r*0.35, d.r*1.1, d.r*0.42, 0, 0, Math.PI*2); ctx.fill();
    if (d.t === 'fern'){
      const img = SPRITE_IMGS.fern;
      if (img && img.complete && img.naturalWidth){
        const s = d.r * 2.4 * (d.s || 1);
        ctx.globalAlpha = 0.92;
        if (d.flip){
          ctx.save(); ctx.translate(d.x, d.y); ctx.scale(-1, 1);
          ctx.drawImage(img, -s/2, -s*0.58, s, s);
          ctx.restore();
        } else {
          ctx.drawImage(img, d.x - s/2, d.y - s*0.58, s, s);
        }
        ctx.globalAlpha = 1;
      }
    } else if (d.t === 'bones'){
      const img = SPRITE_IMGS.bones;
      if (img && img.complete && img.naturalWidth){
        const s = d.r * 2.6;
        ctx.globalAlpha = 0.95;
        ctx.drawImage(img, d.x - s/2, d.y - s*0.5, s, s);
        ctx.globalAlpha = 1;
      }
    } else if (d.t === 'grass'){
      // 程序化草丛：根植地面、随风轻摆、与地面同色系
      const n = 5 + (Math.floor(d.r*7) % 4);
      const base = d.r * 1.8, aw = d.flip ? -1 : 1;
      for (let k=0;k<n;k++){
        const ox = d.x + (k - (n-1)/2) * (d.r*0.42);
        const h = base * (0.65 + ((k*37 % 10) / 14));
        const sway = Math.sin(T*1.6 + ox*0.3 + k) * (k%2 ? 1.4 : 0.8);
        const lean = aw * (0.25 + ((k*53 % 7) / 12)) + sway*0.04;
        const tipx = ox + lean*6 + sway, tipy = d.y - h;
        const g = ctx.createLinearGradient(ox, d.y, tipx, tipy);
        g.addColorStop(0, '#3a4a26'); g.addColorStop(0.6, '#5e7a3a'); g.addColorStop(1, '#9bb866');
        ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ox, d.y);
        ctx.quadraticCurveTo(ox + lean*3 + sway*0.5, d.y - h*0.6, tipx, tipy);
        ctx.stroke();
      }
    } else if (d.t === 'stone'){
      // 有体积的碎石：顶亮底暗，与地面同冷暖
      const r = d.r * 1.5, seed = d.seed || 0.5;
      const g = ctx.createLinearGradient(d.x, d.y - r, d.x, d.y + r*0.7);
      g.addColorStop(0, '#8c8474'); g.addColorStop(0.55, '#5e5749'); g.addColorStop(1, '#2f2a22');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(d.x - r, d.y + r*0.3);
      ctx.quadraticCurveTo(d.x - r*0.9, d.y - r*0.8, d.x - r*0.2, d.y - r*0.7);
      ctx.quadraticCurveTo(d.x + r*0.5, d.y - r, d.x + r*0.9, d.y - r*0.2);
      ctx.quadraticCurveTo(d.x + r*1.1, d.y + r*0.5, d.x + r*0.3, d.y + r*0.7);
      ctx.quadraticCurveTo(d.x - r*0.4, d.y + r*0.9, d.x - r, d.y + r*0.3);
      ctx.closePath(); ctx.fill();
      // 顶部苔藓高光
      ctx.fillStyle = 'rgba(110,130,70,0.5)';
      ctx.beginPath(); ctx.ellipse(d.x - r*0.15, d.y - r*0.4, r*0.42, r*0.22, -0.4, 0, Math.PI*2); ctx.fill();
    } else if (d.t === 'tomb'){
      // 墓碑：圆顶石碑 + 顶部苔藓 + 裂纹，像风化遗迹
      const w = d.r * 1.15, h = d.r * 2.1, seed = d.seed || 0.5;
      const g = ctx.createLinearGradient(d.x, d.y - h*0.5, d.x, d.y + h*0.5);
      g.addColorStop(0, '#6a6358'); g.addColorStop(0.6, '#48433a'); g.addColorStop(1, '#26221c');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(d.x - w/2, d.y + h*0.5);
      ctx.lineTo(d.x - w/2, d.y - h*0.18);
      ctx.quadraticCurveTo(d.x, d.y - h*0.62, d.x + w/2, d.y - h*0.18);
      ctx.lineTo(d.x + w/2, d.y + h*0.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(120,140,76,0.45)';
      ctx.beginPath(); ctx.ellipse(d.x - w*0.12, d.y - h*0.46, w*0.32, h*0.1, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(20,18,14,0.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(d.x + w*0.1, d.y - h*0.1);
      ctx.lineTo(d.x - w*0.05, d.y + h*0.1);
      ctx.lineTo(d.x + w*0.12, d.y + h*0.35);
      ctx.stroke();
    }
  }
}

function drawBlockers(ctx, game){
  const list = game.blockers;
  for (let i=0;i<list.length;i++){
    const b = list[i];
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y + b.r*0.45, b.r*1.05, b.r*0.42, 0, 0, Math.PI*2); ctx.fill();
    let img = null, s = b.r * 3.5, dy = 0.62;
    if (b.t === 'rock'){ img = SPRITE_IMGS.rock; s = b.r * 2.7; }
    else if (b.t === 'log'){ img = SPRITE_IMGS.log; s = b.r * 3.6; dy = 0.5; }
    else if (b.t === 'ruin'){ img = SPRITE_IMGS.ruin; s = b.r * 3.4; dy = 0.95; }
    else { img = SPRITE_IMGS['tree' + ((b.tone || 0) + 1)]; }
    if (img && img.complete && img.naturalWidth){
      if (b.flip){
        ctx.save(); ctx.translate(b.x, b.y); ctx.scale(-1, 1);
        ctx.drawImage(img, -s/2, -s*dy, s, s);
        ctx.restore();
      } else {
        ctx.drawImage(img, b.x - s/2, b.y - s*dy, s, s);
      }
    } else {
      ctx.fillStyle = (b.t === 'rock' || b.t === 'ruin') ? FOREST.rock : FOREST.trunk;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawWalls(ctx, game){
  const list = game.walls;
  for (let i=0;i<list.length;i++){
    const w = list[i];
    const hw = w.hw, hh = w.hh;
    ctx.save();
    ctx.translate(w.cx, w.cy);
    ctx.rotate(w.ang);
    // 地面投影
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(-hw + 3, -hh + 6, hw*2, hh*2);
    // 石墙主体（沿厚度方向做明暗，模拟体积）
    const grad = ctx.createLinearGradient(0, -hh, 0, hh);
    grad.addColorStop(0, '#6f6757'); grad.addColorStop(0.5, '#4a4234'); grad.addColorStop(1, '#2c261d');
    ctx.fillStyle = grad; ctx.fillRect(-hw, -hh, hw*2, hh*2);
    // 顶部受光高光
    ctx.fillStyle = 'rgba(196,184,156,0.38)'; ctx.fillRect(-hw, -hh, hw*2, Math.min(3, hh*0.5));
    // 砖缝（沿长度方向竖缝 + 横向错缝）
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 1;
    for (let x=-hw+12; x<hw; x+=15){ ctx.beginPath(); ctx.moveTo(x, -hh); ctx.lineTo(x, hh); ctx.stroke(); }
    for (let y=-hh+10; y<hh; y+=11){
      const off = ((Math.floor((y+hh)/11)) % 2) * 7;
      ctx.beginPath(); ctx.moveTo(-hw + off, y); ctx.lineTo(hw, y); ctx.stroke();
    }
    // 裂纹
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(hw*0.18, -hh+2); ctx.lineTo(hw*0.34, hh-2); ctx.stroke();
    ctx.strokeStyle = 'rgba(210,198,170,0.18)';
    ctx.beginPath(); ctx.moveTo(-hw*0.3, -hh+3); ctx.lineTo(-hw*0.1, hh*0.4); ctx.stroke();
    ctx.restore();
    // 墙脚碎石（让墙像是自然长在地图上，而非漂浮方块）
    ctx.fillStyle = 'rgba(70,64,54,0.9)';
    const rg = w.cx + Math.cos(w.ang)*hw, gg = w.cy + Math.sin(w.ang)*hw;
    for (let k=0;k<3;k++){
      const a = w.ang + (k-1)*0.9;
      const rx = w.cx + Math.cos(a)*(hw+4), ry = w.cy + Math.sin(a)*(hh+4);
      ctx.beginPath(); ctx.ellipse(rx, ry, 5, 3, a, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawEffects(ctx, game){
  const list = game.effects;
  for (let i=0;i<list.length;i++){
    const e = list[i];
    const a = Math.max(0, e.life / e.maxLife);
    if (e.star){
      ctx.globalAlpha = a * 0.95;
      ctx.strokeStyle = e.color; ctx.lineWidth = e.w;
      ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      const R = e.maxR * (0.35 + 0.65 * (1 - a));
      for (let k=0;k<8;k++){
        const ang = k * Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(e.x - Math.cos(ang)*R, e.y - Math.sin(ang)*R);
        ctx.lineTo(e.x + Math.cos(ang)*R, e.y + Math.sin(ang)*R);
        ctx.stroke();
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      continue;
    }
    if (e.flash){
      // 枪口闪光：方向性四角星 + 亮核
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.ang);
      const R = e.maxR * (0.6 + 0.4 * a);
      const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.35, e.color); fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(R*1.5, 0); ctx.lineTo(R*0.28, -R*0.34); ctx.lineTo(0, -R);
      ctx.lineTo(-R*0.28, -R*0.34); ctx.lineTo(-R*1.2, 0);
      ctx.lineTo(-R*0.28, R*0.34); ctx.lineTo(0, R);
      ctx.lineTo(R*0.28, R*0.34);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
      continue;
    }
    if (e.bolt){
      // 天降闪电：从高空劈下的锯齿电光 + 落地光环
      ctx.globalAlpha = a * 0.95;
      ctx.strokeStyle = e.color; ctx.lineWidth = e.w + 2;
      ctx.shadowColor = e.color; ctx.shadowBlur = 14;
      ctx.beginPath();
      let ly = e.y - 240;
      ctx.moveTo(e.x + (Math.sin(e.x) * 6), ly);
      const segs = 7;
      for (let s=1;s<=segs;s++){
        const yy = e.y - 240 + (240 * s / segs);
        const xx = e.x + Math.sin(s * 1.7 + e.x) * (10 - s) ;
        ctx.lineTo(xx, yy);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = a * 0.9;
    ctx.strokeStyle = e.color; ctx.lineWidth = e.w;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawGem(ctx, x, y, r, color, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r*0.72, 0); ctx.lineTo(0, r); ctx.lineTo(-r*0.72, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.moveTo(0, -r*0.55); ctx.lineTo(r*0.3, 0); ctx.lineTo(0, r*0.25); ctx.lineTo(-r*0.3, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawVignette(ctx, game, w, h){
  if (game.hurtFlash <= 0) return;
  const a = Math.min(0.5, game.hurtFlash * 0.45);
  const g = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.22, w/2, h/2, Math.max(w,h)*0.62);
  g.addColorStop(0, 'rgba(255,60,80,0)');
  g.addColorStop(1, 'rgba(255,60,80,' + a + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

function drawStick(ctx, input){
  if (!input.active) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(input.ox, input.oy, 52, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.arc(input.cx, input.cy, 22, 0, Math.PI*2); ctx.fill();
}

 * 音效 + 背景音乐
 * ========================================================================== */
const SFX = {
  ctx: null, enabled: true, _shootAt: 0, _pickAt: 0, _hitAt: 0, _wtAt: 0, _killAt: 0,
  init(){
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type, vol, slideTo){
    if (!this.enabled || !this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  shoot(){ const now = Date.now(); if (now - this._shootAt < 70) return; this._shootAt = now; this.tone(560, 0.05, 'square', 0.02, 320); },
  noise(dur, vol, t0){
    if (!this.enabled || !this.ctx) return;
    const c = this.ctx; const t = t0 || c.currentTime;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=0.6;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t+dur+0.02);
  },
  kill(){
    const now = Date.now(); if (now - this._killAt < 55) return; this._killAt = now;
    this.noise(0.09, 0.05);
    this.tone(430, 0.045, 'square', 0.028, 560);
  },
  hit(){ this.tone(120, 0.16, 'sawtooth', 0.07, 60); },
  levelup(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.13,'triangle',0.055), i*75)); },
  dead(){ [440,330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,0.28,'sine',0.09), i*150)); },
  pickup(){ const now = Date.now(); if (now - this._pickAt < 110) return; this._pickAt = now; this.tone(1180, 0.06, 'triangle', 0.028, 1560); },
  boss(){ this.tone(88, 0.5, 'sawtooth', 0.065, 58); setTimeout(() => this.tone(124, 0.42, 'sawtooth', 0.055, 80), 250); },
  boom(){ this.tone(150, 0.22, 'sawtooth', 0.05, 50); },
  // 每种武器自己的开火音 / 命中音（带节流，避免叠音破音）
  weaponTone(arr){ if (!this.enabled || !this.ctx || !arr) return; const now = Date.now(); if (now - this._wtAt < 28) return; this._wtAt = now; this.tone(arr[0], arr[1], arr[2], arr[3], arr[4]); },
  hitTone(arr){ if (!this.enabled || !this.ctx || !arr) return; const now = Date.now(); if (now - this._hitAt < 55) return; this._hitAt = now; this.tone(arr[0], arr[1], arr[2], arr[3], arr[4]); }
};

const BGM = {
  on: true, timer: null, step: 0, next: 0, delay: null, fb: null, wet: null,
  root: 261.63,                       // C4
  bpm: 84,                            // 轻慢放松，像轻音乐
  // 四小节：C – Am – F – G（I vi IV V，清新不腻）
  chords: [[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,16]],
  // 分解和弦音型（和弦音索引，8 分音符循环）
  arpPat: [0,2,1,2,3,2,1,2],
  // 主旋律：[起始16分音符步, 半音, 时长(步)] —— 一条能哼出来的线
  melody: [
    [0,7,4],[4,9,4],[8,7,4],[12,4,4],
    [16,9,4],[20,12,4],[24,11,4],[28,9,4],
    [32,9,4],[36,12,4],[40,14,4],[44,12,4],
    [48,11,4],[52,14,4],[56,12,8]
  ],
  start(){
    if (!SFX.ctx || !this.on || this.timer) return;
    const c = SFX.ctx;
    // 更长的混响尾，空间感更松弛
    this.delay = c.createDelay(); this.delay.delayTime.value = 0.30;
    this.fb = c.createGain(); this.fb.gain.value = 0.36;
    this.wet = c.createGain(); this.wet.gain.value = 0.30;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.wet); this.wet.connect(c.destination);
    this.step = 0; this.next = c.currentTime + 0.18;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop(){
    if (this.timer){ clearInterval(this.timer); this.timer = null; }
    if (this.delay){ try{ this.delay.disconnect(); this.wet.disconnect(); this.fb.disconnect(); }catch(e){} this.delay = null; }
  },
  fr(semi){ return this.root * Math.pow(2, semi / 12); },
  tick(){
    if (!SFX.ctx || !this.on) return;
    const spb = 60 / this.bpm / 4;
    let guard = 0;
    while (this.next < SFX.ctx.currentTime + 0.25 && guard++ < 64){
      this.play(this.step, this.next);
      this.step = (this.step + 1) % 64;
      this.next += spb;
    }
  },
  play(step, t){
    const bar = Math.floor(step / 16) % 4;
    const bs = step % 16;
    const spb = 60 / this.bpm / 4;
    const ch = this.chords[bar];
    // 分解和弦：8 分音符轻拨，铺底的流动感
    if (bs % 2 === 0){
      const tone = ch[this.arpPat[(bs / 2) % 8] % ch.length];
      this.pluck(this.fr(tone), 0.5, 0.020, t);
    }
    // 柔和贝斯：小节第 1 拍根音、第 3 拍五音
    if (bs === 0) this.bass(this.fr(ch[0] - 12), t, 0.9);
    if (bs === 8) this.bass(this.fr(ch[2] - 12), t, 0.65);
    // 极轻沙锤替代鼓组（反拍），不抢旋律
    if (bs % 4 === 2) SFX.noise(0.035, 0.006, t);
    // 主旋律
    for (let i = 0; i < this.melody.length; i++){
      const m = this.melody[i];
      if (m[0] === step) this.piano(this.fr(m[1]), m[2] * spb * 0.96, t);
    }
  },
  // 钢琴主音：三角基音 + 八度泛音 + 微弱五度，快起慢落
  piano(f, dur, t){
    const c = SFX.ctx; if (!c) return;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.036, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(c.destination); if (this.delay) g.connect(this.delay);
    const o = c.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.setValueAtTime(f * 2, t);
    const g2 = c.createGain(); g2.gain.setValueAtTime(0.5, t); g2.gain.linearRampToValueAtTime(0, t + dur * 0.7);
    const o3 = c.createOscillator(); o3.type = 'sine'; o3.frequency.setValueAtTime(f * 1.5, t);
    const g3 = c.createGain(); g3.gain.setValueAtTime(0.14, t); g3.gain.linearRampToValueAtTime(0, t + dur * 0.5);
    o.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
    o.start(t); o2.start(t); o3.start(t);
    o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); o3.stop(t + dur + 0.05);
  },
  // 分解和弦拨音
  pluck(f, dur, vol, t){
    const c = SFX.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.setValueAtTime(f * 2, t);
    const g2 = c.createGain(); g2.gain.setValueAtTime(0.25, t); g2.gain.linearRampToValueAtTime(0, t + dur * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(c.destination); if (this.delay) g.connect(this.delay);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  },
  bass(f, t, dur){
    const c = SFX.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
};

const bgTileImg = new Image();
bgTileImg.src = BG_TILE;

const el = {
  hud: $('hud'), hpFill: $('hpFill'), hpText: $('hpText'), dps: $('dpsText'),
  lv: $('lvText'), expFill: $('expFill'), timer: $('timerText'), kills: $('killsText'),
  weaponBar: $('weaponBar'),
  menu: $('menuMask'), levelup: $('levelupMask'), pause: $('pauseMask'), dead: $('deadMask'), loadout: $('loadoutMask'),
  loadoutGrid: $('loadoutGrid'), loadoutHint: $('loadoutHint'), btnLoadoutGo: $('btnLoadoutGo'),
  cards: $('cardsBox'), result: $('resultBox'), record: $('recordBox'),
  best: $('bestText'), best2: $('bestText2'), btnPause: $('btnPause'),
  btnSound: $('btnSound'), rotate: $('rotate')
};

let vw = 800, vh = 400, dpr = 1;
const STICK_R = 52, DEAD_ZONE = 0.16;
let lastStats = null;

const game = new Game({
  width: vw, height: vh,
  onLevelUp: showCards,
  onDeath: onDeath,
  onEvent: (msg) => { toast(msg); if (msg.indexOf('焰鳞龙') >= 0 || msg.indexOf('兽潮') >= 0) SFX.boss(); }
});
game.onShoot = () => SFX.shoot();
game.onKill = () => SFX.kill();
game.onHurt = () => SFX.hit();
game.onPickup = () => SFX.pickup();

function loadBest(){
  try {
    const raw = localStorage.getItem('shadow-survivor-best');
    const v = raw ? JSON.parse(raw) : { kills:0, time:0 };
    return { kills: v.kills || 0, time: v.time || 0 };
  } catch (e) { return { kills:0, time:0 }; }
}
function saveBest(kills, time){
  const b = loadBest();
  const isNew = kills > b.kills;
  if (isNew || time > b.time){
    try { localStorage.setItem('shadow-survivor-best', JSON.stringify({ kills: Math.max(kills, b.kills), time: Math.max(time, b.time) })); } catch (e) {}
  }
  return isNew;
}
function renderBest(){
  const b = loadBest();
  const s = '历史最佳：击杀 ' + b.kills + ' · 存活 ' + fmtTime(b.time);
  el.best.textContent = s; el.best2.textContent = s;
}

function resizeCanvas(){
  const rect = canvas.parentNode.getBoundingClientRect();
  vw = Math.max(1, Math.round(rect.width));
  vh = Math.max(1, Math.round(rect.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  game.resize(vw, vh);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

function checkOrientation(){
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  const portrait = window.innerHeight > window.innerWidth;
  el.rotate.style.display = (coarse && portrait) ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

let pointerId = null;
function beginPointer(x, y){
  if (!game.isRunning) return;
  pointerId = 'p';
  game.setStick(true, x, y, x, y);
  game.setInput(0, 0);
}
function movePointer(x, y){
  if (pointerId === null || !game.isRunning) return;
  const inp = game.input;
  let dx = x - inp.ox, dy = y - inp.oy;
  const d = Math.sqrt(dx*dx + dy*dy);
  if (d > STICK_R){ dx = (dx/d)*STICK_R; dy = (dy/d)*STICK_R; }
  game.setStick(true, inp.ox, inp.oy, inp.ox + dx, inp.oy + dy);
  const nl = Math.sqrt(dx*dx + dy*dy) / STICK_R;
  if (nl < DEAD_ZONE) game.setInput(0, 0);
  else game.setInput(dx / STICK_R, dy / STICK_R);
}
function endPointer(){
  pointerId = null;
  game.setStick(false, 0, 0, 0, 0);
  game.setInput(0, 0);
}
canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  if (!t || pointerId !== null) return;
  const rect = canvas.getBoundingClientRect();
  beginPointer(t.clientX - rect.left, t.clientY - rect.top);
  e.preventDefault();
}, { passive:false });
canvas.addEventListener('touchmove', (e) => {
  const rect = canvas.getBoundingClientRect();
  for (let i=0;i<e.changedTouches.length;i++){
    const t = e.changedTouches[i];
    movePointer(t.clientX - rect.left, t.clientY - rect.top);
  }
  e.preventDefault();
}, { passive:false });
canvas.addEventListener('touchend', (e) => { endPointer(); e.preventDefault(); }, { passive:false });
canvas.addEventListener('touchcancel', endPointer);
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  pointerId = 'm';
  beginPointer(e.clientX - rect.left, e.clientY - rect.top);
});
window.addEventListener('mousemove', (e) => {
  if (pointerId !== 'm') return;
  const rect = canvas.getBoundingClientRect();
  movePointer(e.clientX - rect.left, e.clientY - rect.top);
});
window.addEventListener('mouseup', () => { if (pointerId === 'm') endPointer(); });

const KEY_MAP = {
  KeyW: [0,-1], ArrowUp: [0,-1], KeyS: [0,1], ArrowDown: [0,1],
  KeyA: [-1,0], ArrowLeft: [-1,0], KeyD: [1,0], ArrowRight: [1,0]
};
const keysDown = {};
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Escape' || e.code === 'KeyP'){
    e.preventDefault();
    togglePause();
    return;
  }
  if (KEY_MAP[e.code]){ keysDown[e.code] = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => { if (KEY_MAP[e.code]) keysDown[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keysDown) keysDown[k] = false; });

function applyInput(){
  let kx = 0, ky = 0;
  for (const code in keysDown){
    if (!keysDown[code]) continue;
    const v = KEY_MAP[code];
    kx += v[0]; ky += v[1];
  }
  if (kx !== 0 || ky !== 0){
    game.setStick(false, 0, 0, 0, 0);
    const l = Math.sqrt(kx*kx + ky*ky);
    game.setInput(kx/l, ky/l);
  } else if (pointerId === null){
    game.setInput(0, 0);
  }
}

function setState(s){
  el.menu.hidden = s !== 'menu';
  el.levelup.hidden = s !== 'levelup';
  el.pause.hidden = s !== 'paused';
  el.dead.hidden = s !== 'dead';
  el.loadout.hidden = s !== 'loadout';
  el.hud.classList.toggle('hide', s === 'menu' || s === 'loadout');
  el.btnPause.textContent = s === 'paused' ? '继续' : '暂停';
}

function showCards(cards){
  SFX.levelup();
  el.cards.innerHTML = '';
  cards.forEach((c) => {
    const div = document.createElement('div');
    const elKey = c.el || 'metal';
    div.className = 'card' + (c.kind === 'weapon' ? ' weapon' : '') + ' el-' + elKey;
    div.innerHTML =
      '<div class="card-el">' + (EL_LABEL[elKey] || '') + '</div>' +
      '<div class="card-icon">' + c.icon + '</div>' +
      '<div class="card-kind">' + c.kindLabel + '</div>' +
      '<div class="card-name">' + c.name + '</div>' +
      '<div class="card-desc">' + c.desc + '</div>' +
      '<div class="card-lv">' + c.lvText + '</div>';
    div.addEventListener('click', () => {
      game.chooseCard(c);
      SFX.tone(880, 0.09, 'triangle', 0.05);
      setState(game.state === 'levelup' ? 'levelup' : 'playing');
      renderWeaponBar();
    });
    el.cards.appendChild(div);
  });
  setState('levelup');
}

function renderWeaponBar(){
  const ws = game.player.weapons;
  let html = '';
  for (let i=0;i<ws.length;i++){
    const def = WEAPONS[ws[i].id];
    if (!def) continue;
    html += '<div class="wslot">' + def.icon + '<span class="wtag">' + ws[i].lv + '</span></div>';
  }
  el.weaponBar.innerHTML = html;
}

let toastTimer = null;
function toast(msg){
  let t = $('__toast');
  if (!t){
    t = document.createElement('div');
    t.id = '__toast';
    t.style.cssText = 'position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:20;' +
      'padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.65);color:#ffd166;' +
      'font-size:13px;pointer-events:none;transition:opacity .25s';
    document.getElementById('app').appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 1500);
}

function onDeath(stats){
  SFX.dead();
  BGM.stop();
  lastStats = stats;
  const isNew = saveBest(stats.kills, stats.time);
  el.record.innerHTML = isNew ? '<div class="new-record">新纪录</div>' : '';
  el.result.innerHTML =
    '<div class="result-item"><span>存活</span><b>' + fmtTime(stats.time) + '</b></div>' +
    '<div class="result-item"><span>击杀</span><b>' + stats.kills + '</b></div>' +
    '<div class="result-item"><span>等级</span><b>Lv.' + stats.level + '</b></div>' +
    '<div class="result-item"><span>武器</span><b>' + stats.weapons + ' 件</b></div>' +
    '<div class="result-item"><span>输出</span><b>' + stats.dps + '</b></div>';
  renderBest();
  setState('dead');
}

function togglePause(){
  if (game.state === 'paused'){
    game.resume();
    setState(game.state === 'levelup' ? 'levelup' : 'playing');
    if (BGM.on && SFX.ctx) BGM.start();
  } else if (game.pause()){
    setState('paused');
    BGM.stop();
  }
}

function buildShareText(){
  if (!lastStats) return '';
  return '我在《百兽围城》撑了 ' + fmtTime(lastStats.time) + '，击杀 ' + lastStats.kills +
         '，Lv.' + lastStats.level + '，输出 ' + lastStats.dps + '。你敢来试试吗？';
}
$('btnShare').addEventListener('click', () => {
  const txt = buildShareText();
  const done = () => toast('战绩已复制');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
});
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败'); }
  document.body.removeChild(ta);
}
$('btnCard').addEventListener('click', () => {
  if (!lastStats) return;
  const W = 800, H = 640;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0e17'; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(126,240,255,.15)'; g.lineWidth = 1;
  g.beginPath();
  for (let x=0;x<W;x+=40){ g.moveTo(x,0); g.lineTo(x,H); }
  for (let y=0;y<H;y+=40){ g.moveTo(0,y); g.lineTo(W,y); }
  g.stroke();
  g.fillStyle = '#ffffff'; g.textAlign = 'center';
  g.font = '800 56px system-ui, sans-serif';
  g.fillText('百兽围城', W/2, 130);
  g.fillStyle = '#8ea0bd'; g.font = '400 22px system-ui, sans-serif';
  g.fillText('特工猫的战斗记录', W/2, 176);
  g.textAlign = 'left';
  const rows = [['存活时间', fmtTime(lastStats.time)], ['累计击杀', String(lastStats.kills)],
                ['最终等级', 'Lv.' + lastStats.level], ['武器数量', lastStats.weapons + ' 件'],
                ['每秒输出', String(lastStats.dps)]];
  rows.forEach((rw, i) => {
    const y = 250 + i * 62;
    g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(140, y + 34); g.lineTo(W - 140, y + 34); g.stroke();
    g.fillStyle = '#8ea0bd'; g.font = '400 24px system-ui, sans-serif';
    g.fillText(rw[0], 140, y + 24);
    g.fillStyle = '#ffffff'; g.font = '700 26px system-ui, sans-serif';
    g.textAlign = 'right';
    g.fillText(rw[1], W - 140, y + 24);
    g.textAlign = 'left';
  });
  g.fillStyle = '#ffd166'; g.font = '400 20px system-ui, sans-serif'; g.textAlign = 'center';
  g.fillText('你能撑多久？', W/2, H - 48);
  const a = document.createElement('a');
  a.download = '百兽围城-战绩.png';
  a.href = c.toDataURL('image/png');
  a.click();
  toast('战绩卡已保存');
});

$('btnStart').addEventListener('click', showLoadout);
$('btnRestart1').addEventListener('click', showLoadout);
$('btnRestart2').addEventListener('click', showLoadout);
$('btnResume').addEventListener('click', togglePause);
el.btnPause.addEventListener('click', togglePause);
el.btnSound.addEventListener('click', () => {
  SFX.enabled = !SFX.enabled;
  el.btnSound.textContent = '音效：' + (SFX.enabled ? '开' : '关');
});
$('btnMusic').addEventListener('click', () => {
  BGM.on = !BGM.on;
  $('btnMusic').textContent = '音乐：' + (BGM.on ? '开' : '关');
  if (BGM.on){ if (game.isRunning && SFX.ctx) BGM.start(); }
  else BGM.stop();
});

/* ---------- 开局选武器：11 选 2 ---------- */
let loadoutPicks = [];
function showLoadout(){
  SFX.init();
  loadoutPicks = [];
  el.loadoutGrid.innerHTML = '';
  el.btnLoadoutGo.disabled = true;
  el.loadoutHint.innerHTML = '已选 <b>0</b> / 2';
  const kindMap = { ranged:'远程', melee:'近战', orbit:'环绕', strike:'天降' };
  for (const k in WEAPONS){
    const def = WEAPONS[k];
    const card = document.createElement('div');
    card.className = 'wcard';
    card.dataset.wid = def.id;
    card.innerHTML =
      '<div class="wcard-icon">' + def.icon + '</div>' +
      '<div class="wcard-name">' + def.name + '</div>' +
      '<div class="wcard-kind">' + (kindMap[def.kind] || def.kind) + ' · ' + (EL_LABEL[WEAPON_EL[def.id]] || '') + '</div>' +
      '<div class="wcard-feat">' + def.feat + '</div>' +
      '<div class="wcard-stats">伤害 ' + def.dmg + ' · 间隔 ' + def.cd.toFixed(2) + 's</div>';
    card.addEventListener('click', () => {
      const i = loadoutPicks.indexOf(def.id);
      if (i >= 0) loadoutPicks.splice(i, 1);
      else {
        if (loadoutPicks.length >= 2) loadoutPicks.shift();
        loadoutPicks.push(def.id);
      }
      SFX.tone(660, 0.06, 'triangle', 0.04);
      refreshLoadout();
    });
    el.loadoutGrid.appendChild(card);
  }
  refreshLoadout();
  setState('loadout');
}
function refreshLoadout(){
  const cards = el.loadoutGrid.children;
  for (let i=0;i<cards.length;i++){
    cards[i].classList.toggle('picked', loadoutPicks.indexOf(cards[i].dataset.wid) >= 0);
  }
  el.loadoutHint.innerHTML = '已选 <b>' + loadoutPicks.length + '</b> / 2' +
    (loadoutPicks.length === 2 ? ' · ' + loadoutPicks.map((id) => WEAPONS[id].name).join(' + ') : '');
  el.btnLoadoutGo.disabled = loadoutPicks.length !== 2;
}
$('btnLoadoutGo').addEventListener('click', () => startGame(loadoutPicks.slice()));

function startGame(picks){
  SFX.init();
  endPointer();
  for (const k in keysDown) keysDown[k] = false;
  game.reset();
  const picks2 = (picks && picks.length) ? picks.slice(0, PLAYER.maxWeapons) : ['pistol'];
  for (let i=0;i<picks2.length;i++) game.player.giveWeapon(picks2[i]);
  game.start();
  setState('playing');
  renderWeaponBar();
  if (BGM.on) BGM.start();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && (game.isRunning || game.state === 'levelup')){
    if (game.pause()) setState('paused');
  }
});

let hudAt = 0, hudCache = '';
function syncHud(now){
  if (now - hudAt < 100) return;
  hudAt = now;
  const p = game.player;
  const hpPct = Math.round(clamp(p.hp / p.maxHp * 100, 0, 100));
  const dps = Math.round(game.estimateDps());
  const key = Math.ceil(p.hp) + '|' + hpPct + '|' + p.level + '|' + Math.round(p.exp/p.expNeed*100) +
              '|' + dps + '|' + game.kills + '|' + Math.floor(game.time) + '|' + p.weapons.length;
  if (key === hudCache) return;
  hudCache = key;
  el.hpFill.style.width = hpPct + '%';
  el.hpText.textContent = Math.max(0, Math.ceil(p.hp)) + ' / ' + Math.round(p.maxHp);
  el.dps.textContent = '输出 ' + dps;
  el.lv.textContent = 'Lv.' + p.level;
  el.expFill.style.width = Math.round(clamp(p.exp / p.expNeed * 100, 0, 100)) + '%';
  el.timer.textContent = fmtTime(game.time);
  el.kills.textContent = '击杀 ' + game.kills;
}

let last = 0;
function frame(ts){
  const now = ts || performance.now();
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 1/60;
  dt = clamp(dt, 0, 0.05);
  applyInput();
  game.update(dt);
  render(ctx, game, vw, vh);
  syncHud(now);
  requestAnimationFrame(frame);
}

resizeCanvas();
checkOrientation();
renderBest();
renderWeaponBar();
setState('menu');
requestAnimationFrame(frame);

})();
</script>
