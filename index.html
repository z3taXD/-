const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const rand = (a,b) => a + Math.random() * (b - a);
const dist2 = (ax,ay,bx,by) => { const dx = ax-bx, dy = ay-by; return dx*dx + dy*dy; };
const fmtTime = (s) => { const t = Math.floor(s); const m = Math.floor(t/60); const r = t%60;
  return (m<10?'0':'') + m + ':' + (r<10?'0':'') + r; };
function weightedPick(items, wf){
  let total = 0;
  for (let i=0;i<items.length;i++){ items[i]._w = Math.max(0, wf(items[i], i)); total += items[i]._w; }
  if (total <= 0) return items[items.length-1];
  let r = Math.random() * total;
  for (let i=0;i<items.length;i++){ r -= items[i]._w; if (r <= 0) return items[i]; }
  return items[items.length-1];
}
class Pool {
  constructor(factory, limit){ this.factory = factory; this.limit = limit || 400; this.free = []; }
  get(){ return this.free.length ? this.free.pop() : this.factory(); }
  put(o){ if (this.free.length < this.limit) this.free.push(o); }
}
function compact(arr, pool){
  let n = arr.length;
  for (let i = 0; i < n;){
    if (!arr[i].alive){
      const dead = arr[i];
      arr[i] = arr[n-1]; arr.pop(); n--;
      if (pool) pool.put(dead);
    } else i++;
  }
}

class Player {
  constructor(){ this.reset(); }
  reset(){
    this.x = 0; this.y = 0;
    this.level = 1; this.exp = 0; this.expNeed = EXP.need(1);
    this.m = newModifiers(); this.skillLevels = {};
    this.maxHp = PLAYER.maxHp; this.hp = this.maxHp;
    this.inv = 0; this.aim = 0;
    this.weapons = [];                 // 由开局选武器界面填充；为空时 drawCards 会补武器卡
    this.wcd = {};
    this.orbitAngle = 0; this.orbitTick = 0;
    this.reviveUsed = false;
    this.shield = 0; this.shieldMax = 0;
    this.recalc();
  }
  recalc(){
    const m = this.m, B = PLAYER;
    this.maxHp = B.maxHp + m.hpAdd;
    this.shieldMax = m.shieldMax;
    this.moveSpeed = B.moveSpeed * (1 + m.movePct);
    this.pickupRange = B.pickupRange * (1 + m.pickupPct);
    this.crit = clamp(B.crit + m.critAdd, 0, 0.9);
    this.critMult = B.critMult + m.critMultAdd;
    if (this.hp > this.maxHp) this.hp = this.maxHp;
  }
  hasWeapon(id){
    for (let i=0;i<this.weapons.length;i++) if (this.weapons[i].id === id) return this.weapons[i];
    return null;
  }
  // 返回 'new' | 'up' | null
  giveWeapon(id){
    const w = this.hasWeapon(id);
    if (w){
      if (w.lv >= WEAPON_MAX_LV) return null;
      w.lv++;
      return 'up';
    }
    if (this.weapons.length >= PLAYER.maxWeapons) return null;
    this.weapons.push({ id:id, lv:1 });
    this.wcd[id] = 0;
    return 'new';
  }
  learn(id){
    const s = findSkill(id); if (!s) return;
    s.apply(this);
    if (!s.filler) this.skillLevels[id] = (this.skillLevels[id] || 0) + 1;
    this.recalc();
    if (id === 'shield') this.shield = this.shieldMax;
  }
}

/* ==========================================================================
 * 引擎
 * ========================================================================== */
class Game {
  constructor(opts){
    opts = opts || {};
    this.w = opts.width || 800; this.h = opts.height || 400;
    this.onLevelUp = opts.onLevelUp || function(){};
    this.onDeath = opts.onDeath || function(){};
    this.onEvent = opts.onEvent || function(){};
    this.enemyPool = new Pool(()=>({alive:false,hits:[]}), 260);
    this.bulletPool = new Pool(()=>({alive:false,hits:[]}), 320);
    this.ebulletPool = new Pool(()=>({alive:false}), 120);
    this.orbPool = new Pool(()=>({alive:false}), 300);
    this.particlePool = new Pool(()=>({alive:false}), 160);
    this.slashPool = new Pool(()=>({alive:false,hits:[]}), 24);
    this.player = new Player();
    this.cells = new Map();
    this.biomes = new Map();
    this.blockers = []; this.decor = []; this.ponds = []; this.walls = [];
    this.effects = []; this.shake = 0; this.hurtFlash = 0;
    this.updateBounds();
    this.reset();
  }
  updateBounds(){
    this._halfDiag = Math.sqrt(this.w*this.w + this.h*this.h) / 2;
    this._despawnR = this._halfDiag + SPAWN.despawnPad;
  }
  clampPlayer(){
    const p = this.player, lim = ARENA.half - PLAYER.radius;
    if (p.x < -lim) p.x = -lim; else if (p.x > lim) p.x = lim;
    if (p.y < -lim) p.y = -lim; else if (p.y > lim) p.y = lim;
  }
  reset(){
    this.state = 'ready';
    this.time = 0; this.kills = 0; this._eid = 0;
    this.player.reset();
    this.enemies = []; this.bullets = []; this.ebullets = []; this.orbs = [];
    this.particles = []; this.slashes = []; this.drones = [];
    this.spawnTimer = 0.6; this.waveTimer = 30; this.auraTimer = 0; this.pendingLevelUps = 0;
    this.effects = []; this.shake = 0; this.hurtFlash = 0;
    this.cells.clear(); this.biomes.clear();
    this.blockers = []; this.decor = []; this.ponds = []; this.walls = []; this.lights = []; this.corpses = [];
    this.camera = { x:0, y:0 };
    this.input = { x:0, y:0, active:false, ox:0, oy:0, cx:0, cy:0 };
    this.syncCamera();
    this.buildLights();
    this.updateTerrain();
  }
  // 地图光源：火把/篝火/灯笼，暖色调、全图不超过 10 个、避开出生点
  buildLights(){
    this.lights = [];
    const N = 8;
    const types = ['torch', 'campfire', 'lantern', 'torch', 'campfire', 'lantern', 'torch', 'campfire'];
    for (let i=0;i<N;i++){
      const a = (i / N) * Math.PI * 2 + this.hash2(i, 77) * 0.7;
      const dist = 330 + this.hash2(i + 31, 12) * 520;
      const x = Math.cos(a) * dist, y = Math.sin(a) * dist;
      if (Math.abs(x) < 170 && Math.abs(y) < 170) continue;
      this.lights.push({
        x:x, y:y, type: types[i % types.length],
        phase: this.hash2(i, 5) * Math.PI * 2,
        r: (types[i % types.length] === 'campfire' ? 130 : 100) + this.hash2(i, 9) * 30
      });
    }
  }
  resize(w,h){ this.w = w; this.h = h; this.updateBounds(); }
  start(){ this.state = 'playing'; }
  pause(){ if (this.state === 'playing' || this.state === 'levelup'){ this._prev = this.state; this.state = 'paused'; return true; } return false; }
  resume(){ if (this.state === 'paused') this.state = this._prev === 'levelup' ? 'levelup' : 'playing'; }
  get isRunning(){ return this.state === 'playing'; }
  syncCamera(){ this.camera.x = this.player.x - this.w/2; this.camera.y = this.player.y - this.h/2; }

  update(dt){
    if (this.state !== 'playing') return;
    const p = this.player;
    this.time += dt;
    if (p.inv > 0) p.inv -= dt;
    if (this.shake > 0){ this.shake -= dt * 42; if (this.shake < 0) this.shake = 0; }
    if (this.hurtFlash > 0){ this.hurtFlash -= dt * 2.6; if (this.hurtFlash < 0) this.hurtFlash = 0; }
    this.updateTerrain();

    if (this.input.x !== 0 || this.input.y !== 0){
      p.x += this.input.x * p.moveSpeed * dt * this.slowFactor(p.x, p.y);
      p.y += this.input.y * p.moveSpeed * dt * this.slowFactor(p.x, p.y);
      this.clampPlayer();
      this.resolveBlockers(p, PLAYER.radius * 0.85);
    }

    this.updateWeapons(dt);
    this.updateDrones(dt);
    this.updateBullets(dt);
    this.updateEBullets(dt);
    this.updateEnemies(dt);
    this.updateSlashes(dt);
    this.collide();
    this.updateOrbs(dt);
    this.updateAura(dt);
    this.updateRegen(dt);
    this.updateSpawn(dt);
    this.updateParticles(dt);
    this.updateEffects(dt);
    this.updateCorpses(dt);

    compact(this.enemies, this.enemyPool);
    compact(this.bullets, this.bulletPool);
    compact(this.ebullets, this.ebulletPool);
    compact(this.orbs, this.orbPool);
    compact(this.particles, this.particlePool);
    compact(this.slashes, this.slashPool);

    this.syncCamera();

    if (this.pendingLevelUps > 0){
      this.pendingLevelUps--;
      this.state = 'levelup';
      this.onLevelUp(this.drawCards());
    }
    if (p.hp <= 0){ p.hp = 0; this.die(); }
  }

  /* ---------- 三选一：混合武器卡与被动卡 ---------- */
  drawCards(){
    const p = this.player;
    const out = [];
    const pool = SKILLS.filter((s) => (p.skillLevels[s.id] || 0) < s.max);
    const wpool = [];
    for (const k in WEAPONS){
      const w = p.hasWeapon(k);
      if (!w){
        if (p.weapons.length < PLAYER.maxWeapons) wpool.push({ id:k, isNew:true });
      } else if (w.lv < WEAPON_MAX_LV){
        wpool.push({ id:k, isNew:false });
      }
    }
    let guard = 0;
    while (out.length < 3 && guard++ < 60){
      // 约 40% 概率出武器卡（有可用武器时）
      const wantWeapon = wpool.length && Math.random() < 0.5;
      if (wantWeapon){
        const pick = wpool.splice(Math.floor(Math.random()*wpool.length), 1)[0];
        const def = WEAPONS[pick.id];
        const w = p.hasWeapon(pick.id);
        out.push({
          kind:'weapon', id:def.id, name:def.name, icon:def.icon,
          kindLabel: pick.isNew ? '新武器' : '武器升级',
          desc: pick.isNew ? weaponDesc(def) : (def.name + ' 强化至 Lv.' + ((w ? w.lv : 0) + 1)),
          lvText: pick.isNew ? '新获得' : 'Lv.' + ((w ? w.lv : 0) + 1) + ' / ' + WEAPON_MAX_LV,
          el: WEAPON_EL[def.id] || 'metal'
        });
      } else if (pool.length){
        const idx = Math.floor(Math.random()*pool.length);
        const s = pool.splice(idx, 1)[0];
        const lv = p.skillLevels[s.id] || 0;
        out.push({ kind:'skill', id:s.id, name:s.name, icon:s.icon, kindLabel:'被动',
                   desc:s.desc(lv+1), lvText:'Lv.' + (lv+1) + ' / ' + s.max,
                   el: SKILL_EL[s.id] || 'metal' });
      } else if (wpool.length){
        continue;
      } else {
        out.push({ kind:'skill', id:FILLER.id, name:FILLER.name, icon:FILLER.icon, kindLabel:'即时',
                   desc:FILLER.desc(), lvText:'即时生效', el:'wood' });
      }
    }
    while (out.length < 3){
      out.push({ kind:'skill', id:FILLER.id, name:FILLER.name, icon:FILLER.icon, kindLabel:'即时',
                 desc:FILLER.desc(), lvText:'即时生效', el:'wood' });
    }
    return out;
  }
  chooseCard(card){
    if (card.kind === 'weapon') this.player.giveWeapon(card.id);
    else this.player.learn(card.id);
    if (this.pendingLevelUps > 0){
      this.pendingLevelUps--;
      this.state = 'levelup';
      this.onLevelUp(this.drawCards());
    } else this.state = 'playing';
  }

  die(){
    this.state = 'dead';
    this.onDeath({ time:this.time, kills:this.kills, level:this.player.level,
                   dps: Math.round(this.estimateDps()), weapons: this.player.weapons.length });
  }
  estimateDps(){
    const p = this.player, cdr = 1 / (1 + p.m.cdrPct);
    let total = 0;
    for (let i=0;i<p.weapons.length;i++){
      const w = p.weapons[i], def = WEAPONS[w.id];
      const dmg = this.weaponDamage(def, w.lv);
      const count = def.count || 1;
      if (def.kind === 'orbit') total += dmg / 0.3 * 1.5;
      else total += (dmg * count) / (def.cd * cdr);
    }
    return total;
  }
  weaponDamage(def, lv){
    const p = this.player;
    let d = (def.dmg + def.dmgLv * (lv - 1)) * (1 + p.m.dmgPct);
    d *= (1 + (p.level - 1) * 0.05);                       // 等级带来的全局成长
    if (p.m.rampage > 0 && p.hp < p.maxHp * 0.4) d *= (1 + p.m.rampage);
    return d;
  }

  /* ---------- 武器：各自独立冷却 ---------- */
  updateWeapons(dt){
    const p = this.player;
    const cdr = 1 / (1 + p.m.cdrPct);
    for (let i=0;i<p.weapons.length;i++){
      const w = p.weapons[i];
      const def = WEAPONS[w.id];
      if (!def) continue;
      let cd = p.wcd[w.id];
      if (cd === undefined) cd = 0;
      cd -= dt;
      if (cd <= 0){
        cd = def.cd * cdr;
        this.useWeapon(def, w.lv);
      }
      p.wcd[w.id] = cd;
    }
    if (p.hasWeapon('orbit')) this.updateOrbit(dt);
  }
  useWeapon(def, lv){
    const p = this.player;
    if (def.tone) SFX.weaponTone(def.tone);          // 每种武器自己的开火音
    if (def.kind === 'ranged'){
      const range = (def.id === 'sniper' ? 820 : 600) * (1 + p.m.velPct * 0.6);
      const t = this.nearestEnemy(p.x, p.y, range);
      if (!t) return;
      p.aim = Math.atan2(t.y - p.y, t.x - p.x);
      const count = (def.count || 1) + (lv >= 3 ? 1 : 0) + (lv >= 5 ? 1 : 0) + p.m.multishot;
      const dmg = this.weaponDamage(def, lv);
      const speed = def.speed * (1 + p.m.velPct * 0.5);
      for (let i=0;i<count;i++){
        const sp = def.spread > 0 ? def.spread : 0.12;
        const off = count === 1 ? 0 : (i - (count-1)/2) * sp;
        this.spawnBullet(p.x, p.y, p.aim + off, dmg, (def.pierce || 0) + p.m.pierceAdd, {
          speed: speed, life: def.life, r: def.br, aoe: def.aoe || 0, wid: def.id, color: def.hit,
          style: def.style || 'bullet', ret: def.ret || 0
        });
      }
      // 枪口闪光（每种武器自己的颜色与大小）
      const fs = (def.id === 'sniper' ? 26 : def.id === 'shotgun' ? 24 : def.id === 'grenade' ? 18 : 13);
      this.addFlash(p.x + Math.cos(p.aim) * 16, p.y + Math.sin(p.aim) * 16, p.aim, def.hit, fs);
      if (def.id === 'shotgun') this.addShake(1.2);
    } else if (def.kind === 'melee'){
      const t = this.nearestEnemy(p.x, p.y, def.reach + 40);
      const ang = t ? Math.atan2(t.y - p.y, t.x - p.x) : p.aim;
      this.spawnSlash(p.x, p.y, ang, def.arc * (1 + (lv >= 5 ? 0.25 : 0)),
                      def.reach * (1 + (lv >= 3 ? 0.15 : 0)),
                      this.weaponDamage(def, lv), def.knock || 0, def.id);
    } else if (def.kind === 'strike'){
      const t = this.nearestEnemy(p.x, p.y, 680);
      if (!t) return;
      const dmg = this.weaponDamage(def, lv);
      this.addBolt(t.x, t.y, def.hit);                       // 天降闪电
      this.addRing(t.x, t.y, def.hit, def.aoe * 1.5, 0.34, 3);
      this.addRing(t.x, t.y, '#ffffff', def.aoe, 0.2, 2);
      this.addShake(2.2);
      const list = this.enemies;
      for (let i=0;i<list.length;i++){
        const e = list[i];
        if (dist2(e.x, e.y, t.x, t.y) < def.aoe * def.aoe){
          this.damageEnemy(e, dmg, false);
          this.hitFx(e.x, e.y, def.id);
        }
      }
    }
  }

  /* 命中特效：每种武器一套视觉语言 */
  hitFx(x, y, wid){
    const def = WEAPONS[wid];
    if (!def) return;
    const col = def.hit;
    switch (def.fx){
      case 'snipe':
        this.addStar(x, y, col, 36); this.addRing(x, y, col, 34, 0.26, 2.5); this.burst(x, y, col, 5); this.addShake(0.8); break;
      case 'burst':
        this.burst(x, y, col, 7); this.addRing(x, y, col, 30, 0.24, 3); break;
      case 'boom':
        this.burst(x, y, col, 14); this.addRing(x, y, col, 50, 0.34, 4); this.addShake(2); break;
      case 'slash':
        this.burst(x, y, col, 4); this.addRing(x, y, col, 18, 0.18, 2); break;
      case 'spin':
        this.burst(x, y, col, 4); this.addRing(x, y, col, 22, 0.2, 2); break;
      case 'bolt':
        this.addStar(x, y, col, 42); this.addRing(x, y, '#ffffff', (WEAPONS.bolt.aoe || 60), 0.25, 3); this.addShake(1.2); break;
      default:
        this.burst(x, y, col, 4); this.addRing(x, y, col, 16, 0.18, 2);
    }
    this.playHit(wid);
  }
  playHit(wid){
    const def = WEAPONS[wid];
    if (def && def.hitTone) SFX.hitTone(def.hitTone);
  }
  updateOrbit(dt){
    const p = this.player;
    const w = p.hasWeapon('orbit');
    if (!w) return;
    const def = WEAPONS.orbit;
    p.orbitAngle += dt * 3.1;
    p.orbitTick -= dt;
    if (p.orbitTick > 0) return;
    p.orbitTick = 0.28;
    const n = 1 + (w.lv >= 3 ? 1 : 0) + (w.lv >= 5 ? 1 : 0);
    const dmg = this.weaponDamage(def, w.lv);
    const r = def.radius;
    for (let i=0;i<n;i++){
      const a = p.orbitAngle + (i * Math.PI * 2 / n);
      const ox = p.x + Math.cos(a) * r, oy = p.y + Math.sin(a) * r;
      const list = this.enemies;
      for (let j=0;j<list.length;j++){
        const e = list[j];
        if (!e.alive) continue;
        const rr = def.br + e.radius;
        if (dist2(ox, oy, e.x, e.y) < rr * rr){ this.damageEnemy(e, dmg, false); this.playHit('orbit'); }
      }
    }
  }
  spawnSlash(x, y, ang, arc, reach, dmg, knock, wid){
    const s = this.slashPool.get();
    s.alive = true; s.x = x; s.y = y; s.ang = ang; s.arc = arc; s.reach = reach;
    s.dmg = dmg; s.knock = knock || 0; s.wid = wid || 'blade';
    s.life = 0.18; s.maxLife = 0.18; s.hits.length = 0;
    this.slashes.push(s);
  }
  updateSlashes(dt){
    const list = this.slashes;
    for (let i=0;i<list.length;i++){
      const s = list[i];
      s.life -= dt;
      if (s.life <= 0){ s.alive = false; continue; }
      s.x = this.player.x; s.y = this.player.y;
      const es = this.enemies;
      for (let j=0;j<es.length;j++){
        const e = es[j];
        if (!e.alive || s.hits.indexOf(e.id) >= 0) continue;
        const rr = s.reach + e.radius;
        if (dist2(s.x, s.y, e.x, e.y) > rr * rr) continue;
        let da = Math.atan2(e.y - s.y, e.x - s.x) - s.ang;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        if (Math.abs(da) > s.arc / 2) continue;
        s.hits.push(e.id);
        this.damageEnemy(e, s.dmg, false);
        this.playHit(s.wid);
        if (s.knock > 0){
          const d = Math.sqrt(dist2(s.x, s.y, e.x, e.y)) || 1;
          e.x += ((e.x - s.x) / d) * s.knock * 0.12;
          e.y += ((e.y - s.y) / d) * s.knock * 0.12;
        }
      }
    }
  }

  /* ---------- 子弹 ---------- */
  spawnBullet(x, y, ang, dmg, pierce, opt){
    if (this.bullets.length >= VIEW.maxBullets) return;
    const p = this.player;
    opt = opt || {};
    const b = this.bulletPool.get();
    b.alive = true; b.x = x; b.y = y; b.ang = ang;
    const sp = opt.speed || 450;
    b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    b.life = opt.life || 0.85; b.r = opt.r || 4; b.dmg = dmg; b.pierce = pierce || 0;
    b.chain = p.m.chain; b.crit = Math.random() < p.crit ? p.critMult : 1;
    b.frost = p.m.frostSlow > 0; b.aoe = opt.aoe || 0;
    b.homing = p.m.homing > 0; b.wid = opt.wid || 'pistol'; b.color = opt.color || '#ffffff'; b.hits.length = 0;
    b.style = opt.style || 'bullet'; b.ret = opt.ret || 0; b.retAt = opt.ret ? (opt.life || 0.85) * 0.5 : 0; b.spin = Math.random() * Math.PI;
    this.bullets.push(b);
  }
  updateBullets(dt){
    const list = this.bullets;
    const bs = this.blockers;
    for (let i=0;i<list.length;i++){
      const b = list[i];
      b.life -= dt;
      if (b.life <= 0){ this.boom(b); continue; }
      // 追踪
      if (b.homing){
        const t = this.nearestEnemy(b.x, b.y, 260);
        if (t){
          const want = Math.atan2(t.y - b.y, t.x - b.x);
          let cur = Math.atan2(b.vy, b.vx);
          let da = want - cur;
          while (da > Math.PI) da -= Math.PI * 2;
          while (da < -Math.PI) da += Math.PI * 2;
          const na = cur + clamp(da, -4.2 * dt, 4.2 * dt);
          const sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
        }
      }
      // 回旋镖：飞出到一半后转向飞回玩家，往返都造成伤害
      if (b.ret > 0 && b.life < b.retAt){
        const tp = this.player;
        const want = Math.atan2(tp.y - b.y, tp.x - b.x);
        let cur = Math.atan2(b.vy, b.vx);
        let da = want - cur;
        while (da > Math.PI) da -= Math.PI*2; while (da < -Math.PI) da += Math.PI*2;
        const na = cur + clamp(da, -7*dt, 7*dt);
        const sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
        b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
      }
      b.x += b.vx*dt; b.y += b.vy*dt;
      // 榴弹尾烟
      if (b.style === 'bomb' && Math.random() < 0.55) this.smoke(b.x, b.y);
      let hit = false;
      for (let j=0;j<bs.length;j++){
        const bl = bs[j];
        if (bl.t !== 'rock' && bl.t !== 'ruin') continue;
        const rr = bl.r + b.r;
        if (dist2(b.x, b.y, bl.x, bl.y) < rr*rr){
          if (b.bounce > 0){
            const ndist = Math.sqrt(dist2(b.x, b.y, bl.x, bl.y)) || 0.001;
            const nx = (b.x - bl.x)/ndist, ny = (b.y - bl.y)/ndist;
            const dot = b.vx*nx + b.vy*ny;
            b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
            b.x = bl.x + nx*(bl.r + b.r + 0.5); b.y = bl.y + ny*(bl.r + b.r + 0.5);
            b.bounce--;
          } else { this.boom(b); }
          hit = true; break;
        }
      }
      if (!hit){
        const ws = this.walls;
        for (let j=0;j<ws.length;j++){
          const w = ws[j];
          const d0x = b.x - w.cx, d0y = b.y - w.cy;
          if (d0x*d0x + d0y*d0y > (w.br + b.r)*(w.br + b.r)) continue;
          const ca = Math.cos(w.ang), sa = Math.sin(w.ang);
          const lx = d0x*ca + d0y*sa, ly = -d0x*sa + d0y*ca;
          const clx = clamp(lx, -w.hw, w.hw), cly = clamp(ly, -w.hh, w.hh);
          const ddx = lx - clx, ddy = ly - cly;
          if (ddx*ddx + ddy*ddy < b.r*b.r){
            let nx, ny;
            if (ddx*ddx + ddy*ddy > 0.0001){ const d = Math.sqrt(ddx*ddx + ddy*ddy); nx = ddx/d; ny = ddy/d; }
            else { nx = 0; ny = -1; }
            const wnx = nx*ca - ny*sa, wny = nx*sa + ny*ca;
            if (b.bounce > 0){
              const dot = b.vx*wnx + b.vy*wny;
              b.vx -= 2*dot*wnx; b.vy -= 2*dot*wny;
              b.x = w.cx + (clx*ca - cly*sa) + wnx*(b.r + 0.5);
              b.y = w.cy + (clx*sa + cly*ca) + wny*(b.r + 0.5);
              b.bounce--;
            } else { this.boom(b); }
            break;
          }
        }
      }
    }
  }
  boom(b){
    if (!b.alive) return;
    b.alive = false;
    if (b.aoe > 0){
      this.addRing(b.x, b.y, '#ffb066', b.aoe, 0.28, 3);
      this.addShake(2.2);
      const list = this.enemies;
      for (let i=0;i<list.length;i++){
        const e = list[i];
        if (!e.alive) continue;
        if (dist2(e.x, e.y, b.x, b.y) < b.aoe * b.aoe) this.damageEnemy(e, b.dmg * 0.85, false);
      }
    }
  }

  /* ---------- 敌方子弹（远程怪 / Boss） ---------- */
  spawnEBullet(x, y, ang, dmg, speed, color, r, kind){
    const b = this.ebulletPool.get();
    b.alive = true; b.x = x; b.y = y;
    b.vx = Math.cos(ang) * speed; b.vy = Math.sin(ang) * speed;
    b.dmg = dmg; b.life = 3.2; b.r = r || 6; b.color = color || '#a6ff5c'; b.kind = kind || 'ball';
    this.ebullets.push(b);
  }
  updateEBullets(dt){
    const p = this.player;
    const list = this.ebullets;
    for (let i=0;i<list.length;i++){
      const b = list[i];
      b.life -= dt;
      if (b.life <= 0){ b.alive = false; continue; }
      b.x += b.vx*dt; b.y += b.vy*dt;
      let blocked = false;
      const ws = this.walls;
      for (let j=0;j<ws.length;j++){
        const w = ws[j];
        const dx = b.x - w.cx, dy = b.y - w.cy;
        if (dx*dx + dy*dy > (w.br + b.r)*(w.br + b.r)) continue;
        const ca = Math.cos(w.ang), sa = Math.sin(w.ang);
        const lx = dx*ca + dy*sa, ly = -dx*sa + dy*ca;
        const clx = clamp(lx, -w.hw, w.hw), cly = clamp(ly, -w.hh, w.hh);
        const ddx = lx - clx, ddy = ly - cly;
        if (ddx*ddx + ddy*ddy < b.r*b.r){ blocked = true; break; }
      }
      if (!blocked){
        const bs2 = this.blockers;
        for (let j=0;j<bs2.length;j++){
          const bl = bs2[j]; if (bl.t !== 'rock' && bl.t !== 'ruin') continue;
          const rr2 = bl.r + b.r;
          if (dist2(b.x, b.y, bl.x, bl.y) < rr2*rr2){ blocked = true; break; }
        }
      }
      if (blocked){ b.alive = false; continue; }
      const rr = b.r + PLAYER.radius;
      if (dist2(b.x, b.y, p.x, p.y) < rr * rr){
        b.alive = false;
        this.hurtPlayer(b.dmg, b.x, b.y);
      }
    }
  }

  /* ---------- 敌人 ---------- */
  updateEnemies(dt){
    const p = this.player, list = this.enemies;
    const tw = p.m.timewarp;      // 时缓光环
    for (let i=0;i<list.length;i++){
      const e = list[i]; if (!e.alive) continue;
      if (e.slowT > 0){ e.slowT -= dt; if (e.slowT <= 0) e.slow = 0; }
      if (e.attack > 0) e.attack -= dt;
      if (e.burnT > 0){
        e.burnT -= dt;
        e.hp -= e.burnDps * dt;
        if (e.hp <= 0){ e.alive = false; this.kills++; this.dropExp(e); this.burst(e.x, e.y, e.color, 6); this.addRing(e.x, e.y, '#a6ff5c', 26, 0.3, 2); continue; }
      }
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      if (d > this._despawnR){ e.alive = false; continue; }

      let sp = e.speed * (1 - e.slow) * this.slowFactor(e.x, e.y);
      if (tw > 0 && d < 240) sp *= (1 - tw);

      // —— 各自的行为 ——
      if (e.beh === 'charger'){
        e.chargeT -= dt;
        if (e.chargeT <= 0 && d < 460){ e.chargeT = rand(3.2, 4.6); e.charging = 0.85; }
        if (e.charging > 0){ e.charging -= dt; sp *= 3.2; }
      } else if (e.beh === 'stalker'){
        // 绕圈接近：加一个切向分量
        sp *= 1.05;
        const tang = e.tangSign * (d > 150 ? 0.55 : 0.12);
        e.x += (-dy / d) * sp * dt * tang;
        e.y += (dx / d) * sp * dt * tang;
      } else if (e.beh === 'spitter'){
        e.fireT -= dt;
        if (e.fireT <= 0 && d < 520){
          e.fireT = rand(2.2, 3.2);
          this.spawnEBullet(e.x, e.y, Math.atan2(dy, dx), e.damage * 0.9, 235, '#a6ff5c', 7, 'acid');
        }
        if (d < 300) sp *= 0.45;                 // 保持距离
      } else if (e.beh === 'slam'){
        e.slamT -= dt;
        if (e.slamT <= 0 && d < 150){
          e.slamT = rand(4.0, 5.5);
          e.attack = 0.3;
          this.addRing(e.x, e.y, '#ff5c7a', 120, 0.42, 4);
          this.addShake(4);
          if (dist2(p.x, p.y, e.x, e.y) < 120 * 120) this.hurtPlayer(e.damage * 1.1, e.x, e.y);
        }
      } else if (e.beh === 'boss'){
        e.fireT -= dt;
        if (e.fireT <= 0){
          e.fireT = 2.2;
          for (let k=-1;k<=1;k++){
            this.spawnEBullet(e.x, e.y, Math.atan2(dy, dx) + k * 0.22, e.damage * 0.6, 260, '#c86bff', 9, 'orb');
          }
        }
        e.summonT -= dt;
        if (e.summonT <= 0){
          e.summonT = 11;
          const t5 = ENEMY_TIERS[4];
          for (let k=0;k<3;k++){
            if (this.enemies.length >= SPAWN.maxEnemies) break;
            this.spawnEnemyAt(e.x + rand(-70, 70), e.y + rand(-70, 70), t5);
          }
          this.onEvent('焰鳞龙 召唤了兽群');
        }
      }

      e.x += (dx/d) * sp * dt;
      e.y += (dy/d) * sp * dt;
      this.resolveBlockers(e, e.radius * 0.8);

      e.touchCd -= dt;
      if (d < e.radius + PLAYER.radius && e.touchCd <= 0 && p.inv <= 0){
        e.touchCd = 0.7;
        this.hurtPlayer(e.damage, e.x, e.y);
        e.attack = 0.22;
        if (p.m.thorns > 0){ this.damageEnemy(e, p.m.thorns, false); this.burst(e.x, e.y, '#ffd166', 3); }
        const kb = e.beh === 'brute' ? 2.2 : 1;
        p.x -= (dx/d) * 12 * kb; p.y -= (dy/d) * 12 * kb;
        this.clampPlayer();
        this.resolveBlockers(p, PLAYER.radius * 0.85);
      }
    }
    this.separate();
  }
  separate(){
    const list = this.enemies, n = list.length;
    for (let i=0;i<n;i++){
      const a = list[i]; if (!a.alive) continue;
      for (let j=i+1;j<n;j++){
        const b = list[j]; if (!b.alive) continue;
        const dx = b.x-a.x; if (dx > 60 || dx < -60) continue;
        const dy = b.y-a.y; if (dy > 60 || dy < -60) continue;
        const rr = a.radius+b.radius, d2 = dx*dx+dy*dy;
        if (d2 > rr*rr || d2 === 0) continue;
        const d = Math.sqrt(d2), push = (rr-d)*0.5;
        a.x -= (dx/d)*push; a.y -= (dy/d)*push;
        b.x += (dx/d)*push; b.y += (dy/d)*push;
      }
    }
  }
  hurtPlayer(dmg, sx, sy){
    const p = this.player;
    if (p.inv > 0) return;
    let d = dmg * (1 - p.m.armorPct);
    if (p.shieldMax > 0 && p.shield > 0){
      if (p.shield >= d){ p.shield -= d; d = 0; }
      else { d -= p.shield; p.shield = 0; }
    }
    p.hp -= d;
    p.inv = PLAYER.hitInvincible;
    this.hurtFlash = 1;
    this.addShake(5.5);
    this.addRing(p.x, p.y, '#ff5c7a', 62, 0.32, 3);
    if (this.onHurt) this.onHurt();
    if (p.hp <= 0 && p.m.revive > 0 && !p.reviveUsed){
      p.hp = p.maxHp * 0.45;
      p.reviveUsed = true;
      this.addRing(p.x, p.y, '#ffd166', 150, 0.6, 5);
      this.addShake(9);
      this.onEvent('不屈：死里逃生');
    }
  }
  collide(){
    const bs = this.bullets, es = this.enemies;
    if (!es.length) return;
    for (let i=0;i<bs.length;i++){
      const b = bs[i]; if (!b.alive) continue;
      for (let j=0;j<es.length;j++){
        const e = es[j]; if (!e.alive) continue;
        if (b.hits.indexOf(e.id) >= 0) continue;
        const rr = b.r + e.radius;
        if (dist2(b.x, b.y, e.x, e.y) > rr*rr) continue;
        b.hits.push(e.id);
        this.damageEnemy(e, b.dmg * b.crit, b.crit > 1);
        this.playHit(b.wid);
        if (b.frost && this.player.m.frostSlow > 0){ e.slow = this.player.m.frostSlow; e.slowT = this.player.m.frostDur; }
        if (this.player.m.burnDps > 0){ e.burnDps = this.player.m.burnDps; e.burnT = 2.0; }
        if (b.aoe > 0){ this.boom(b); break; }
        if (b.chain > 0){
          const next = this.nearestEnemyExcept(b.x, b.y, 260, b.hits);
          b.chain--;
          if (next){
            const ang = Math.atan2(next.y - b.y, next.x - b.x);
            const sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
            b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
            b.crit = 1;
            break;
          }
        }
        if (b.pierce > 0) b.pierce--;
        else { b.alive = false; break; }
      }
    }
  }
  damageEnemy(e, dmg, isCrit){
    if (!e.alive) return;
    let d = dmg;
    if (e.beh === 'brute') d *= 0.7;                    // 咒牛有减伤
    e.hp -= d;
    if (e.hp <= 0){
      e.alive = false; this.kills++;
      this.dropExp(e);
      // 击杀反馈：白闪环 + 冲击波 + 尸骸残留 + 碎屑
      this.burst(e.x, e.y, e.color, e.boss ? 16 : 6);
      this.burst(e.x, e.y, '#ffffff', e.boss ? 8 : 2);
      this.addRing(e.x, e.y, '#ffffff', e.radius * 2.6, 0.16, 2);
      this.addRing(e.x, e.y, e.color, e.radius * 3.6, 0.34, e.boss ? 4 : 2.5);
      if (this.corpses.length < 26){
        this.corpses.push({ x:e.x, y:e.y, r:e.radius, color:e.color, life:2.6, maxLife:2.6, boss:!!e.boss });
      }
      this.addShake(e.boss ? 9 : 1.1);
      if (this.player.m.lifesteal > 0) this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.m.lifesteal);
      // 爆裂：击杀时炸周围
      if (this.player.m.blastDmg > 0){
        const radius = 46 + this.player.m.blastRadius;
        const bdmg = this.weaponDamage(WEAPONS.pistol, 1) * this.player.m.blastDmg + this.player.m.blastRadius * 0.5;
        this.addRing(e.x, e.y, '#ff9f45', radius, 0.3, 3);
        const list = this.enemies;
        for (let i=0;i<list.length;i++){
          const o = list[i];
          if (!o.alive) continue;
          if (dist2(o.x, o.y, e.x, e.y) < radius * radius) this.damageEnemy(o, bdmg * 0.6, false);
        }
      }
      // 亡羊：死亡分裂
      if (e.beh === 'splitter' && !e.child){
        const t2 = ENEMY_TIERS[1];
        for (let i=0;i<2;i++){
          if (this.enemies.length >= SPAWN.maxEnemies) break;
          this.spawnEnemyAt(e.x + rand(-26, 26), e.y + rand(-26, 26), t2, true);
        }
      }
      if (e.boss) this.onEvent('击败 焰鳞龙');
      if (this.onKill) this.onKill(e);
    } else if (isCrit) this.burst(e.x, e.y, '#ffe27a', 2);
  }
  burst(x, y, color, count){
    if (this.particles.length > 120) return;
    for (let i=0;i<count;i++){
      const p = this.particlePool.get();
      const a = rand(0, Math.PI*2), s = rand(40,170);
      p.alive = true; p.x = x; p.y = y;
      p.vx = Math.cos(a)*s; p.vy = Math.sin(a)*s;
      p.life = rand(0.15,0.35); p.maxLife = p.life; p.r = rand(1.5,3.5); p.color = color;
      this.particles.push(p);
    }
  }
  // 尾迹烟尘（榴弹等）：慢速膨胀变淡
  smoke(x, y, color){
    if (this.particles.length > 120) return;
    const p = this.particlePool.get();
    p.alive = true; p.x = x + rand(-2,2); p.y = y + rand(-2,2);
    p.vx = rand(-14,14); p.vy = rand(-26,-8);
    p.life = rand(0.3,0.55); p.maxLife = p.life; p.r = rand(3,5.5); p.color = color || 'rgba(150,140,120,0.5)';
    this.particles.push(p);
  }
  nearestEnemy(x, y, range){
    let best = null, bestD = range*range;
    const list = this.enemies;
    for (let i=0;i<list.length;i++){
      const e = list[i]; if (!e.alive) continue;
      const d = dist2(x, y, e.x, e.y);
      if (d < bestD){ bestD = d; best = e; }
    }
    return best;
  }
  nearestEnemyExcept(x, y, range, exclude){
    let best = null, bestD = range*range;
    const list = this.enemies;
    for (let i=0;i<list.length;i++){
      const e = list[i]; if (!e.alive || exclude.indexOf(e.id) >= 0) continue;
      const d = dist2(x, y, e.x, e.y);
      if (d < bestD){ bestD = d; best = e; }
    }
    return best;
  }
  updateParticles(dt){
    const list = this.particles;
    for (let i=0;i<list.length;i++){
      const p = list[i];
      p.life -= dt;
      if (p.life <= 0){ p.alive = false; continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9;
    }
  }
  addRing(x, y, color, maxR, life, width){
    if (this.effects.length > 48) return;
    this.effects.push({ x:x, y:y, r:0, maxR:maxR, life:life, maxLife:life, color:color, w:width || 2 });
  }
  addShake(v){ this.shake = Math.min(16, this.shake + v); }
  addBolt(x, y, color){
    if (this.effects.length > 48) return;
    this.effects.push({ x:x, y:y, r:0, maxR:1, life:0.22, maxLife:0.22, color:color || '#c8f0ff', w:3, bolt:true });
  }
  addStar(x, y, color, size){
    if (this.effects.length > 48) return;
    this.effects.push({ x:x, y:y, r:0, maxR:size || 30, life:0.26, maxLife:0.26, color:color || '#ffe27a', w:3, star:true });
  }
  addFlash(x, y, ang, color, size){
    if (this.effects.length > 48) return;
    this.effects.push({ x:x, y:y, ang:ang, r:0, maxR:size || 16, life:0.09, maxLife:0.09, color:color || '#ffe27a', w:2, flash:true });
  }
  updateEffects(dt){
    const list = this.effects;
    for (let i=list.length-1;i>=0;i--){
      const e = list[i];
      e.life -= dt;
      if (e.life <= 0){ list.splice(i,1); continue; }
      e.r = e.maxR * (1 - e.life / e.maxLife);
    }
  }
  // 尸骸残留：淡出的暗影 + 本色污渍，点缀战场
  updateCorpses(dt){
    const list = this.corpses;
    for (let i=list.length-1;i>=0;i--){
      list[i].life -= dt;
      if (list[i].life <= 0) list.splice(i,1);
    }
  }

  /* ---------- 经验 ---------- */
  dropExp(e){
    if (this.orbs.length >= EXP.orbMergeLimit){ this.orbs[this.orbs.length-1].value += e.exp; return; }
    const o = this.orbPool.get();
    o.alive = true; o.x = e.x + rand(-6,6); o.y = e.y + rand(-6,6);
    o.value = e.exp; o.r = clamp(3 + Math.sqrt(e.exp)*1.4, 3, 11); o.age = 0;
    this.orbs.push(o);
  }
  updateOrbs(dt){
    const p = this.player, list = this.orbs;
    const pr = p.pickupRange, pr2 = pr*pr;
    for (let i=0;i<list.length;i++){
      const o = list[i];
      o.age += dt;
      const d2 = dist2(o.x, o.y, p.x, p.y);
      if (o.age > EXP.homingAfter){
        const d = Math.sqrt(d2) || 1, pull = 320 + Math.min(900, o.age*60);
        o.x += ((p.x-o.x)/d)*pull*dt; o.y += ((p.y-o.y)/d)*pull*dt;
      } else if (d2 < pr2){
        const d = Math.sqrt(d2) || 1, pull = 260 + (1-d/pr)*520;
        o.x += ((p.x-o.x)/d)*pull*dt; o.y += ((p.y-o.y)/d)*pull*dt;
      }
      const rr = PLAYER.radius + o.r;
      if (d2 < rr*rr){
        o.alive = false;
        this.addRing(o.x, o.y, o.value >= 8 ? '#ffd166' : '#7ef0ff', 20, 0.26, 2);
        this.gainExp(o.value);
        if (this.onPickup) this.onPickup();
      }
    }
  }
  gainExp(v){
    const p = this.player;
    p.exp += Math.round(v * (1 + p.m.luckPct));
    while (p.exp >= p.expNeed){
      p.exp -= p.expNeed; p.level++; p.recalc();
      p.expNeed = EXP.need(p.level); this.pendingLevelUps++;
    }
  }

  /* ---------- 无人机 / 光环 ---------- */
  updateDrones(dt){
    const p = this.player, want = p.m.drone;
    while (this.drones.length < want) this.drones.push({ angle:this.drones.length*(Math.PI*2/3), cd:rand(0,0.5) });
    while (this.drones.length > want) this.drones.pop();
    if (!this.drones.length) return;
    for (let i=0;i<this.drones.length;i++){
      const d = this.drones[i];
      d.angle += dt*1.7; d.cd -= dt;
      if (d.cd > 0) continue;
      const t = this.nearestEnemy(p.x, p.y, 460);
      if (!t) continue;
      d.cd = 0.7;
      const dx = p.x + Math.cos(d.angle)*52, dy = p.y + Math.sin(d.angle)*52;
      const ang = Math.atan2(t.y-dy, t.x-dx);
      const b = this.bulletPool.get();
      b.alive = true; b.x = dx; b.y = dy; b.ang = ang;
      b.vx = Math.cos(ang)*400; b.vy = Math.sin(ang)*400;
      b.life = 0.8; b.r = 4; b.dmg = p.m.dmgPct >= 0 ? this.weaponDamage(WEAPONS.pistol, 1) * 0.7 : 8;
      b.pierce = 0; b.chain = 0; b.crit = 1; b.frost = false; b.aoe = 0; b.homing = false;
      b.hits.length = 0;
      this.bullets.push(b);
    }
  }
  updateAura(dt){
    const p = this.player;
    if (p.m.auraDmg <= 0) return;
    this.auraTimer -= dt;
    if (this.auraTimer > 0) return;
    this.auraTimer = 0.4;
    const rr = PLAYER.radius + p.m.auraRadius, r2 = rr*rr, list = this.enemies;
    const dmg = p.m.auraDmg * (1 + (p.level - 1) * 0.05);
    for (let i=0;i<list.length;i++){
      const e = list[i];
      if (dist2(p.x, p.y, e.x, e.y) < r2) this.damageEnemy(e, dmg, false);
    }
  }
  updateRegen(dt){
    const p = this.player, m = p.m;
    if (m.regen > 0 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + m.regen * dt);
    if (m.shieldMax > 0 && p.shield < p.shieldMax){
      p.shield = Math.min(p.shieldMax, p.shield + (m.shieldMax * 0.12 + 3) * dt);
    }
  }

  /* ---------- 刷怪与兽潮 ---------- */
  updateSpawn(dt){
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0){
      this.spawnTimer = SPAWN.interval(this.time);
      const n = SPAWN.batch(this.time);
      for (let i=0;i<n;i++) this.spawnEnemy();
    }
    this.waveTimer -= dt;
    if (this.waveTimer <= 0){
      this.waveTimer = SPAWN.waveInterval;
      this.startWave();
    }
  }
  startWave(){
    const t = this.time, avail = [];
    for (let i=0;i<ENEMY_TIERS.length;i++) if (t >= ENEMY_TIERS[i].unlock && !ENEMY_TIERS[i].boss) avail.push(ENEMY_TIERS[i]);
    if (!avail.length) return;
    let main = avail[0], mw = -1, mi = 0;
    for (let i=0;i<avail.length;i++){
      const w = avail[i].weight(t);
      if (w > mw){ mw = w; main = avail[i]; mi = i; }
    }
    const count = Math.min(SPAWN.waveMax, SPAWN.waveBase + Math.floor(t / 14));
    const a = rand(0, Math.PI*2);
    const d = this._halfDiag + rand(110, 230);
    const cx = this.player.x + Math.cos(a)*d, cy = this.player.y + Math.sin(a)*d;
    const lim = ARENA.half + 80;
    let spawned = 0;
    for (let i=0;i<count;i++){
      if (this.enemies.length >= SPAWN.maxEnemies) break;
      const tier = (Math.random() < 0.78 || mi === 0) ? main : avail[mi - 1];
      this.spawnEnemyAt(clamp(cx + rand(-160,160), -lim, lim), clamp(cy + rand(-160,160), -lim, lim), tier);
      spawned++;
    }
    if (spawned > 0){
      this.onEvent('兽潮来袭');
      if (this.onWave) this.onWave();
    }
  }
  spawnEnemy(){
    if (this.enemies.length >= SPAWN.maxEnemies) return;
    const t = this.time, avail = [];
    for (let i=0;i<ENEMY_TIERS.length;i++) if (t >= ENEMY_TIERS[i].unlock) avail.push(ENEMY_TIERS[i]);
    const tier = weightedPick(avail, (e)=>e.weight(t));
    const r = this._halfDiag + rand(SPAWN.ringPadMin, SPAWN.ringPadMax);
    const a = rand(0, Math.PI*2), p = this.player, lim = ARENA.half + 80;
    this.spawnEnemyAt(clamp(p.x + Math.cos(a)*r, -lim, lim), clamp(p.y + Math.sin(a)*r, -lim, lim), tier);
  }
  spawnEnemyAt(x, y, tier, isChild){
    const t = this.time;
    const e = this.enemyPool.get();
    e.alive = true; e.id = ++this._eid;
    e.x = x; e.y = y;
    e.tier = tier.key; e.name = tier.name; e.color = tier.color; e.beh = tier.beh; e.boss = !!tier.boss;
    const scale = isChild ? 0.62 : 1;
    e.radius = tier.radius * scale;
    e.maxHp = tier.hp * SPAWN.hpMul(t) * scale; e.hp = e.maxHp;
    e.damage = tier.damage * SPAWN.damageMul(t);
    e.speed = tier.speed * SPAWN.speedMul(t) * (isChild ? 1.15 : 1);
    e.exp = Math.max(1, Math.round(tier.exp * scale));
    e.slow = 0; e.slowT = 0; e.touchCd = 0;
    e.child = !!isChild;
    e.chargeT = rand(0.5, 3); e.charging = 0;
    e.fireT = rand(0.5, 2.5); e.slamT = rand(1, 4); e.summonT = 8;
    e.tangSign = Math.random() < 0.5 ? 1 : -1;
    e.burnT = 0; e.burnDps = 0;
    e.phase = Math.random() * Math.PI * 2; e.attack = 0;
    this.enemies.push(e);
    if (e.boss) this.onEvent('焰鳞龙 出现');
  }

  /* ---------- 地形：biome 分区 + 障碍 / 装饰 / 沼泽 ---------- */
  hash2(x, y){
    let h = x * 374761393 + y * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    h = h ^ (h >> 16);
    return (h >>> 0) / 4294967296;
  }
  biomeAt(cx, cy){
    const span = TERRAIN.biomeSpan;
    const bx = Math.floor(cx / span), by = Math.floor(cy / span);
    const key = bx + ':' + by;
    let b = this.biomes.get(key);
    if (b) return b;
    const r = this.hash2(bx * 31 + 7, by * 17 + 3);
    b = BIOMES[Math.floor(r * BIOMES.length) % BIOMES.length];
    if (this.biomes.size > 200) this.biomes.clear();
    this.biomes.set(key, b);
    return b;
  }
  buildCell(cx, cy){
    const key = cx + ':' + cy;
    const cached = this.cells.get(key);
    if (cached) return cached;
    const S = TERRAIN.cell;
    const bm = this.biomeAt(cx, cy);
    const r1 = this.hash2(cx, cy);
    const r2 = this.hash2(cx + 7919, cy - 131);
    const r3 = this.hash2(cx - 331, cy + 5171);
    const r4 = this.hash2(cx + 111, cy + 97);
    const items = [];
    // 障碍：每格最多一个，按 biome 概率互斥抽取（降低密度、避免成片）
    const br = r1;
    const acc = bm.tree + bm.rock + bm.log + bm.ruin;
    if (br < bm.tree)            items.push({ t:'tree', x:cx*S+r2*S, y:cy*S+r3*S, r:20 + r4*8, tone: r2 > 0.5 ? 0 : 1, flip: r3 > 0.5 });
    else if (br < bm.tree + bm.rock)        items.push({ t:'rock', x:cx*S+r2*S, y:cy*S+r3*S, r:14 + r4*6, flip: r3 > 0.5 });
    else if (br < bm.tree + bm.rock + bm.log)   items.push({ t:'log',  x:cx*S+r2*S, y:cy*S+r3*S, r:16 + r4*6, flip: r3 > 0.5 });
    else if (br < acc)                       items.push({ t:'ruin', x:cx*S+r2*S, y:cy*S+r3*S, r:18 + r4*6, flip: r3 > 0.5 });
    // 装饰：每格 0~3 件，形态各异（草丛/石块/墓碑/骨堆/蕨），每处外观略不同
    if (r2 < bm.bones) items.push({ t:'bones', x:cx*S+r3*S, y:cy*S+r4*S, r:11 + r2*7, flip: r1 > 0.5 });
    if (r3 < bm.grass) items.push({ t:'grass', x:cx*S+r4*S, y:cy*S+r1*S, r:8 + r2*8, flip: r2 > 0.5, s:0.7 + r4*0.7 });
    if (r4 < bm.stone) items.push({ t:'stone', x:cx*S+r1*S, y:cy*S+r2*S, r:5 + r3*5, seed: r4 });
    if (r1 < bm.tomb)  items.push({ t:'tomb',  x:cx*S+r2*S, y:cy*S+r3*S, r:11 + r4*7, flip: r3 > 0.5, seed: r1 });
    if (bm.fern && r2 < bm.fern) items.push({ t:'fern', x:cx*S+r3*S, y:cy*S+r4*S, r:9 + r3*11, flip: r1 > 0.5, s: 0.65 + r4*0.6 });
    if (r3 < bm.pond)  items.push({ t:'pond',  x:cx*S + S*0.5, y:cy*S + S*0.5, r:50 + r1*44 });
    // 墙体结构：参考 MOBA 废墟地图，做成有角度/不规则的石块残墙（非横平竖直）
    const walls = [];
    if (!(Math.abs(cx) <= 2 && Math.abs(cy) <= 2)){
      const wr = this.hash2(cx*3+5, cy*7+11);
      if (wr < 0.16){
        const cxw = cx*S + 0.5*S, cyw = cy*S + 0.5*S;
        const jx = (this.hash2(cx+3, cy+5) - 0.5) * S * 0.45;
        const jy = (this.hash2(cx-7, cy+2) - 0.5) * S * 0.45;
        const type = this.hash2(cx-13, cy+29);
        const ht = 9 + this.hash2(cx+91, cy-7)*8;        // 半厚
        const hw = 26 + this.hash2(cx*5, cy*3)*80;       // 半长
        const seg = (x2, y2, ang, hwl, hhl) => walls.push({ cx:x2, cy:y2, ang:ang, hw:hwl, hh:hhl, br:Math.hypot(hwl,hhl) });
        if (type < 0.30){            // 斜墙（明显非直角）
          const ang = 0.42 + (this.hash2(cx+21, cy-11) - 0.5) * 0.85;
          seg(cxw+jx, cyw+jy, ang, hw, ht);
        } else if (type < 0.56){     // 弧形残墙（几段渐变角度，像圆形废墟）
          const base = this.hash2(cx-31, cy+17) * Math.PI;
          const n = 3;
          for (let k=0;k<n;k++){
            const a = base + (k - (n-1)/2) * 0.5;
            seg(cxw+jx + Math.cos(a)*hw*0.22, cyw+jy + Math.sin(a)*hw*0.22, a, hw*0.55, ht);
          }
        } else if (type < 0.80){     // L 形（两段各带角度）
          const ang = 0.40 + this.hash2(cx+41, cy+3)*0.5;
          seg(cxw+jx - Math.cos(ang)*hw*0.5, cyw+jy - Math.sin(ang)*hw*0.5, ang, hw*0.6, ht);
          seg(cxw+jx + Math.sin(ang)*hw*0.5, cyw+jy - Math.cos(ang)*hw*0.5, ang + Math.PI/2, hw*0.6, ht);
        } else {                     // 破屋（回字带缺口，边略斜）
          const x0 = cxw+jx-hw, y0 = cyw+jy-hw;
          seg(x0+hw, y0, 0.06, hw, ht);
          seg(x0, y0+hw, -0.05, hw, ht);
          seg(x0+hw*2-ht, y0, 0.06, hw*0.7, ht);
          seg(x0, y0+hw*2-ht, -0.05, hw*0.7, ht);
        }
      }
    }
    const cell = { items: items, walls: walls };
    if (this.cells.size > 600) this.cells.clear();
    this.cells.set(key, cell);
    return cell;
  }
  updateTerrain(){
    const S = TERRAIN.cell, cam = this.camera;
    const x0 = Math.floor((cam.x - 120) / S), x1 = Math.floor((cam.x + this.w + 120) / S);
    const y0 = Math.floor((cam.y - 120) / S), y1 = Math.floor((cam.y + this.h + 120) / S);
    this.blockers.length = 0;
    this.decor.length = 0;
    this.ponds.length = 0;
    this.walls.length = 0;
    for (let cy=y0; cy<=y1; cy++){
      for (let cx=x0; cx<=x1; cx++){
        const cell = this.buildCell(cx, cy);
        const items = cell.items;
        for (let i=0;i<items.length;i++){
          const it = items[i];
          if (it.t === 'tree' || it.t === 'rock') this.blockers.push(it);
          else if (it.t === 'pond') this.ponds.push(it);
          else this.decor.push(it);
        }
        const ws = cell.walls;
        for (let i=0;i<ws.length;i++) this.walls.push(ws[i]);
      }
    }
  }
  // 沼泽减速
  slowFactor(x, y){
    const list = this.ponds;
    for (let i=0;i<list.length;i++){
      const p = list[i];
      if (dist2(x, y, p.x, p.y) < p.r * p.r) return 1 - POND_SLOW;
    }
    return 1;
  }
  resolveBlockers(obj, radius){
    const bs = this.blockers;
    for (let i=0;i<bs.length;i++){
      const b = bs[i];
      const dx = obj.x - b.x, dy = obj.y - b.y;
      const rr = b.r + radius;
      const d2 = dx*dx + dy*dy;
      if (d2 < rr*rr){
        const d = Math.sqrt(d2) || 0.001;
        const push = rr - d;
        obj.x += (dx/d) * push;
        obj.y += (dy/d) * push;
      }
    }
    const ws = this.walls;
    for (let i=0;i<ws.length;i++){
      const w = ws[i];
      const dx = obj.x - w.cx, dy = obj.y - w.cy;
      if (dx*dx + dy*dy > (w.br + radius) * (w.br + radius)) continue;   // 包围球快速剔除
      const ca = Math.cos(w.ang), sa = Math.sin(w.ang);
      const lx = dx*ca + dy*sa, ly = -dx*sa + dy*ca;
      const clx = clamp(lx, -w.hw, w.hw), cly = clamp(ly, -w.hh, w.hh);
      const ddx = lx - clx, ddy = ly - cly;
      const d2 = ddx*ddx + ddy*ddy;
      if (d2 < radius*radius){
        let nx, ny, push;
        if (d2 > 0.0001){
          const d = Math.sqrt(d2); nx = ddx/d; ny = ddy/d; push = radius - d;
        } else {
          const left = lx + w.hw, right = w.hw - lx, top = ly + w.hh, bot = w.hh - ly;
          const m = Math.min(left, right, top, bot);
          if (m === left){ nx = -1; ny = 0; push = radius + left; }
          else if (m === right){ nx = 1; ny = 0; push = radius + right; }
          else if (m === top){ nx = 0; ny = -1; push = radius + top; }
          else { nx = 0; ny = 1; push = radius + bot; }
        }
        const wnx = nx*ca - ny*sa, wny = nx*sa + ny*ca;
        obj.x += wnx*push; obj.y += wny*push;
      }
    }
  }
  setInput(x,y){ this.input.x = x; this.input.y = y; }
  setStick(active, ox, oy, cx, cy){
    this.input.active = active; this.input.ox = ox; this.input.oy = oy; this.input.cx = cx; this.input.cy = cy;
  }
}

function weaponDesc(def){
  const kindMap = { ranged:'远程', melee:'近战', orbit:'环绕', strike:'天降' };
  const dpsHint = def.kind === 'melee' ? '扇形挥砍'
    : def.kind === 'orbit' ? '环绕持续伤害'
    : def.kind === 'strike' ? '随机落雷'
    : (def.aoe ? '爆炸溅射' : '直线弹道');
  return kindMap[def.kind] + ' · ' + dpsHint;
}

/* ==========================================================================
 * 渲染
 * ========================================================================== */
let groundPattern = null, groundFromImg = false;
function buildGroundPattern(ctx){
  // 首选：AI 生成的饥荒风无缝贴图（烘焙 4×4 随机翻转变体，隐藏重复感）
  if (bgTileImg && bgTileImg.complete && bgTileImg.naturalWidth){
    const T = 4, tw = bgTileImg.naturalWidth, th = bgTileImg.naturalHeight;
    const c = document.createElement('canvas');
    c.width = tw * T; c.height = th * T;
    const g = c.getContext('2d');
    for (let i=0;i<T;i++) for (let j=0;j<T;j++){
      const hFlip = ((i * 7 + j * 13) % 2) === 0, vFlip = ((i * 5 + j * 3) % 2) === 0;
      g.save();
      g.translate(i * tw, j * th);
      if (hFlip){ g.translate(tw, 0); g.scale(-1, 1); }
      if (vFlip){ g.translate(0, th); g.scale(1, -1); }
      g.drawImage(bgTileImg, 0, 0);
      g.restore();
    }
    const pat = ctx.createPattern(c, 'repeat');
    if (pat){ groundPattern = pat; groundFromImg = true; return; }
  }
  // 后备：程序化纹理（贴图未加载完成时先用着）
  const N = 256;
  const c = document.createElement('canvas');
  c.width = N; c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#2b271d';
  g.fillRect(0, 0, N, N);
  // 包裹绘制：保证平铺无缝
  const wrap = (x, y, draw) => {
    for (let ox=-N; ox<=N; ox+=N) for (let oy=-N; oy<=N; oy+=N){
      g.save(); g.translate(ox, oy); draw(); g.restore();
    }
  };
  // 大尺度明暗斑块（荒凉泥土的起伏）
  for (let i=0;i<26;i++){
    const x=Math.random()*N, y=Math.random()*N, r=30+Math.random()*70;
    const col = Math.random()<0.5 ? 'rgba(58,74,42,0.20)' : 'rgba(20,16,11,0.32)';
    wrap(x,y,()=>{ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); });
  }
  // 苔藓 / 干草色小斑块
  for (let i=0;i<64;i++){
    const x=Math.random()*N, y=Math.random()*N, r=6+Math.random()*16;
    const col = Math.random()<0.5 ? 'rgba(74,82,40,0.22)' : 'rgba(96,84,46,0.18)';
    wrap(x,y,()=>{ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); });
  }
  // 细碎颗粒（真实颗粒感）
  for (let i=0;i<1500;i++){
    const x=Math.random()*N, y=Math.random()*N; const v=Math.random();
    g.fillStyle = v<0.5 ? 'rgba(0,0,0,0.18)' : 'rgba(150,150,120,0.07)';
    const s = v<0.5 ? 1 : 2;
    wrap(x,y,()=>{ g.fillRect(x,y,s,s); });
  }
  // 草丛（短曲线）
  g.strokeStyle = 'rgba(60,74,38,0.5)'; g.lineWidth = 1.2;
  for (let i=0;i<70;i++){
    const x=Math.random()*N, y=Math.random()*N, h=4+Math.random()*6, a=(Math.random()*2-1)*0.5;
    wrap(x,y,()=>{ g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+a*4, y-h*0.6, x+Math.sin(a)*h, y-h); g.stroke(); });
  }
  // 小石子
  for (let i=0;i<40;i++){
    const x=Math.random()*N, y=Math.random()*N, r=1.5+Math.random()*3;
    wrap(x,y,()=>{
      g.fillStyle='rgba(120,116,104,0.5)'; g.beginPath(); g.ellipse(x,y,r,r*0.7,0,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x,y+r*0.3,r*0.7,r*0.4,0,0,Math.PI*2); g.fill();
    });
  }
  // 裂纹
  g.strokeStyle='rgba(0,0,0,0.22)'; g.lineWidth=1;
  for (let i=0;i<14;i++){
    const x=Math.random()*N, y=Math.random()*N, len=10+Math.random()*26, ang=Math.random()*Math.PI*2;
    wrap(x,y,()=>{ g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len); g.stroke(); });
  }
  groundPattern = ctx.createPattern(c, 'repeat');
}

/* 颜色工具：按比例调亮/调暗，营造体积明暗 */
function hexToRgb(hex){
  if (hex[0] !== '#') return [180,180,180];
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(hex, amt){
  const c = hexToRgb(hex);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + (amt > 0 ? (255 - v) * amt : v * amt))));
  return 'rgb(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')';
}
/* 一条带体积的腿/臂（粗线 + 末端球，shaded 颜色） */
function drawLimb(ctx, sx, sy, ex, ey, w, color){
  ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(ex, ey, w*0.55, w*0.4, Math.atan2(ey-sy, ex-sx), 0, Math.PI*2); ctx.fill();
}
/* 怪物：伪 3D 体积身体 + 走路循环（前后腿/臂摆动 + 身体起伏 + 朝玩家倾斜） */
/* ================= 怪物：七种怪，七种独立造型 ================= */
function vEllipse(ctx, x, y, rx, ry, light, col, dark){
  const g = ctx.createRadialGradient(x - rx*0.38, y - ry*0.45, Math.max(1, rx*0.12), x, y, Math.max(rx, ry)*1.25);
  g.addColorStop(0, light); g.addColorStop(0.55, col); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); ctx.fill();
}
function cEye(ctx, x, y, r, glow){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r*2.4);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r*2.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#15151c'; ctx.beginPath(); ctx.arc(x, y, r*0.7, 0, Math.PI*2); ctx.fill();
}

/* 腐豕：矮壮冲锋体，大猪鼻 + 上翘獠牙 + 招风耳 + 鬃毛 + 卷尾 */
function drawBoar(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob } = B;
  const bodyY = cy - r*0.12 - bob*0.6, footY = cy + r*0.95;
  // 四条短粗腿（远暗近亮）
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.34;
    drawLimb(ctx, cx + rx*s*r*0.42, bodyY + r*0.35, cx + rx*s*r*0.42 + fx*sw, footY, r*0.20, s > 0 ? light : dark);
  }
  // 身体：宽扁
  vEllipse(ctx, cx, bodyY, r*1.06, r*0.82, light, col, dark);
  // 背鬃
  ctx.strokeStyle = shade(col, -0.35); ctx.lineWidth = r*0.10; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++){
    const bx = cx + rx*i*r*0.3, by = bodyY - r*0.62 + Math.abs(i)*r*0.06;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + rx*r*0.1, by - r*0.3); ctx.stroke();
  }
  // 头 + 大猪鼻
  const hx = cx + fx*r*1.02, hy = bodyY - r*0.18;
  vEllipse(ctx, hx, hy, r*0.46, r*0.42, light, col, dark);
  const nx = hx + fx*r*0.42, ny = hy + fy*r*0.1;
  vEllipse(ctx, nx, ny, r*0.24, r*0.2, light, shade(col, 0.12), dark);
  ctx.fillStyle = 'rgba(20,10,16,0.85)';
  ctx.beginPath(); ctx.arc(nx + rx*r*0.1 - fy*r*0.02, ny - rx*r*0.1 + fy*r*0.02, r*0.05, 0, Math.PI*2); ctx.fill();
  // 招风耳
  for (let s = -1; s <= 1; s += 2){
    ctx.fillStyle = s > 0 ? light : dark;
    ctx.beginPath(); ctx.ellipse(hx + rx*s*r*0.34, hy - r*0.3, r*0.16, r*0.1, rx*s*0.5, 0, Math.PI*2); ctx.fill();
  }
  // 上翘獠牙
  ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = r*0.09; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(nx + rx*s*r*0.12, ny + fy*s*r*0.08);
    ctx.quadraticCurveTo(nx + rx*s*r*0.3 - fx*r*0.06, ny + fy*s*r*0.16 - r*0.2, nx + rx*s*r*0.34 - fx*r*0.1, ny + fy*s*r*0.18 - r*0.34);
    ctx.stroke();
  }
  // 眼睛（怒）
  cEye(ctx, hx + fx*r*0.12 + rx*r*0.2, hy - r*0.16, r*0.085, '#ff6b7a');
  cEye(ctx, hx + fx*r*0.12 - rx*r*0.2, hy - r*0.16, r*0.085, '#ff6b7a');
  // 卷尾
  ctx.strokeStyle = dark; ctx.lineWidth = r*0.08; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - fx*r*1.0, bodyY - r*0.1);
  ctx.quadraticCurveTo(cx - fx*r*1.3, bodyY - r*0.35, cx - fx*r*1.18, bodyY - r*0.5);
  ctx.stroke();
}

/* 亡羊：蓬松羊毛球簇 + 细黑腿 + 黑脸 + 缝合线（不死感） */
function drawSheep(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob, T } = B;
  const bodyY = cy - r*0.05 - bob*0.5, footY = cy + r*0.95;
  const dark2 = shade(col, -0.62);
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.3;
    drawLimb(ctx, cx + rx*s*r*0.34, bodyY + r*0.42, cx + rx*s*r*0.34 + fx*sw, footY, r*0.09, dark2);
  }
  // 羊毛：一圈重叠圆
  const wool = [[0,-r*0.34],[r*0.5,-r*0.1],[-r*0.5,-r*0.1],[r*0.34,r*0.3],[-r*0.34,r*0.3],[0,r*0.42],[r*0.78,r*0.08],[-r*0.78,r*0.08]];
  for (let i = 0; i < wool.length; i++){
    const wx = cx + rx*wool[i][0] + fx*wool[i][1], wy = bodyY + wool[i][1]*0.6 + wool[i][0]*0.1;
    const wr = r*0.42 + (i % 3) * r*0.04;
    vEllipse(ctx, wx, wy, wr, wr*0.92, light, col, dark);
  }
  // 缝合线（亡灵感）
  ctx.strokeStyle = 'rgba(30,26,34,0.5)'; ctx.lineWidth = 1.4;
  for (let i = -1; i <= 1; i++){
    const sx = cx + rx*i*r*0.3, sy = bodyY + r*0.05;
    ctx.beginPath(); ctx.moveTo(sx - r*0.1, sy - r*0.08); ctx.lineTo(sx + r*0.1, sy + r*0.08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - r*0.1, sy + r*0.08); ctx.lineTo(sx + r*0.1, sy - r*0.08); ctx.stroke();
  }
  // 黑脸
  const hx = cx + fx*r*0.92, hy = bodyY - r*0.3;
  vEllipse(ctx, hx, hy, r*0.3, r*0.34, shade(col, -0.1), dark2, shade(col, -0.75));
  // 垂耳
  for (let s = -1; s <= 1; s += 2){
    ctx.fillStyle = dark2;
    ctx.beginPath(); ctx.ellipse(hx + rx*s*r*0.26, hy - r*0.18, r*0.11, r*0.2, rx*s*0.8, 0, Math.PI*2); ctx.fill();
  }
  // 头顶一撮毛
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.arc(hx - fx*r*0.05, hy - r*0.36, r*0.13, 0, Math.PI*2); ctx.fill();
  cEye(ctx, hx + fx*r*0.14 + rx*r*0.11, hy - r*0.02, r*0.075, '#a6e8ff');
  cEye(ctx, hx + fx*r*0.14 - rx*r*0.11, hy - r*0.02, r*0.075, '#a6e8ff');
}

/* 咒牛：巨大肩峰 + 弯角 + 宽鼻环 + 厚腿 */
function drawBull(B, e){
  const { ctx, cx, cy, r, col, light, dark, fx, fy, rx, ry, walk, walk2, bob } = B;
  const bodyY = cy - r*0.1 - bob*0.5, footY = cy + r*0.95;
  for (let s = -1; s <= 1; s += 2){
    const sw = (s > 0 ? walk : walk2) * r*0.3;
    drawLimb(ctx, cx + rx*s*r*0.46, bodyY + r*0.4, cx + rx*s*r*0.46 + fx*sw, footY, r*0.24, s > 0 ? light : dark);
  }
  // 壮硕身体 + 肩峰
  vEllipse(ctx, cx - fx*r*0.1, bodyY, r*1.0, r*0.92, light, col, dark);
  vEllipse(ctx, cx + fx*r*0.34, bodyY - r*0.62, r*0.52, r*0.34, light, col, dark);
  // 腹 AO
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx - fx*r*0.1, bodyY + r*0.5, r*0.62, r*0.34, 0, 0, Math.PI*2); ctx.fill();
  // 头 + 宽鼻
  const hx = cx + fx*r*1.0, hy = bodyY - r*0.34;

  vEllipse(ctx, hx + fx*r*0.42, hy + fy*r*0.12, r*0.3, r*0.24, light, shade(col, 0.1), dark);
  ctx.fillStyle = 'rgba(24,12,14,0.8)';
  ctx.beginPath(); ctx.arc(hx + fx*r*0.5 + rx*r*0.12, hy + fy*r*0.12, r*0.055, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + fx*r*0.5 - rx*r*0.12, hy + fy*r*0.12, r*0.055, 0, Math.PI*2); ctx.fill();
  // 鼻环（金色，点缀）
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = r*0.05;
  ctx.beginPath(); ctx.arc(hx + fx*r*0.5, hy + fy*r*0.12 + r*0.24, r*0.14, 0, Math.PI*1.2); ctx.stroke();
  // 弯角（骨色，向外扫）
  ctx.strokeStyle = '#ddd6c2'; ctx.lineWidth = r*0.13; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2){
    ctx.beginPath();
    ctx.moveTo(hx + rx*s*r*0.3, hy - r*0.26);
    ctx.quadraticCurveTo(hx + rx*s*r*0.85, hy - r*0.72, hx + rx*s*r*0.55 + fx*r*0.3, hy - r*0.95);
    ctx.stroke();
  }
  cEye(ctx, hx + fx*r*0.16 + rx*r*0.2, hy - r*0.12, r*0.085, '#ff8f4d');
